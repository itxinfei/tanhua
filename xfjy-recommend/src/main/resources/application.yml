server:
  port: 18087

spring:
  application:
    name: xfjy-recommend
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
        namespace: ${NACOS_NAMESPACE:}
  mongodb:
    uri: mongodb://192.168.20.130:27017/xfjy
  data:
    redis:
      host: 192.168.20.130
      port: 6379
      password: 123456
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-wait: 5000ms
          max-idle: 100
          min-idle: 10

# RocketMQ（与 circle/video 生产端同集群，消费 xfjy-quanzi / xfjy-video topic）
rocketmq:
  name-server: 192.168.20.130:9876
  producer:
    group: xfjy-recommend