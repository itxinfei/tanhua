server:
  port: 18087

spring:
  application:
    name: xfjy-recommend
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.20.133:8848
        username: nacos
        password: nacos
        namespace:
  mongodb:
    uri: mongodb://192.168.20.133:27017/xfjy
  data:
    redis:
      host: 192.168.20.133
      port: 6379
      password: 
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-wait: 5000ms
          max-idle: 100
          min-idle: 10

# 内部服务鉴权 Token（可选逗号分隔，生产环境建议通过 INTERNAL_AUTH_TOKENS 环境变量注入覆盖）
internal:
  auth:
    tokens: xfjy-internal-dev-token-change-in-prod

# RocketMQ（与 circle/video 生产端同集群，消费 xfjy-quanzi / xfjy-video topic）
rocketmq:
  name-server: 192.168.20.133:9876
  producer:
    group: xfjy-recommend