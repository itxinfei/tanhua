server:
  port: 18087

spring:
  application:
    name: xfjy-recommend
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
  mongodb:
    uri: mongodb://127.0.0.1:27017/xfjy
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-wait: 5000ms
          max-idle: 100
          min-idle: 10

# RocketMQ（与 circle/video 生产端同集群，消费 xfjy-quanzi / xfjy-video topic）
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: xfjy-recommend