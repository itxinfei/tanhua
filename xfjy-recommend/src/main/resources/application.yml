server:
  port: 18087

spring:
  application:
    name: xfjy-recommend
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/xfjy
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-wait: 5000ms
          max-idle: 100
          min-idle: 10

# RocketMQ（与 circle/video 生产端同集群，消费 xfjy-quanzi / xfjy-video topic）
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: xfjy-recommend