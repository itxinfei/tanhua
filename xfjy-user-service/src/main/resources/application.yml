server:
  port: 18090

spring:
  application:
    name: xfjy-user-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.20.133:8848
        username: nacos
        password: nacos
        namespace:
        # 默认不注册，仅订阅（discovery 仍可用）：本地裸跑通常只起部分服务，
        # 注册后会被网关/其他服务轮询到并因下游不可达返回 503。
        # CI/容器打包由 deploy/application-local.ci.yml 覆盖为 true；本地需参与服务发现时
        # 在 application-local.yml 里显式设回 true。
        register-enabled: false
  profiles:
    active: local
  mongodb:
    uri: mongodb://192.168.20.133:27017/xfjy
  data:
    redis:
      host: 192.168.20.133
      port: 6379
      password: 
      timeout: 10s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.20.133:3306/xfjy?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  cache:
    type: redis

# 内部服务鉴权 Token（可选逗号分隔，生产环境建议通过 INTERNAL_AUTH_TOKENS 环境变量注入覆盖）
internal:
  auth:
    tokens: xfjy-internal-dev-token-change-in-prod

# MyBatis-Plus（tb_user_info 由本服务独占）
mybatis-plus:
  global-config:
    db-config:
      table-prefix: tb_
      id-type: auto