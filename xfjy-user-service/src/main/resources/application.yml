server:
  port: 18090

spring:
  application:
    name: xfjy-user-service
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/xfjy
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 10s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/xfjy?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  cache:
    type: redis

# MyBatis-Plus（tb_user_info 由本服务独占）
mybatis-plus:
  global-config:
    db-config:
      table-prefix: tb_
      id-type: auto
