# ============================================================
# 心飞交友 - 后端 Java 服务容器编排（部署用）
#
# 运行（在宿主机，由 Gitea Actions 自动执行）：
#   docker compose -p xfjy-app -f deploy/docker-compose.app.yml up -d --build
#
# 设计要点：
#   - 每个服务用 network_mode: host，直接复用宿主机网络。
#     这样既有的 application-*.yml 里 MySQL/Redis/Nacos/RocketMQ 等 127.0.0.1 连接串
#     全部生效（中间件端口已映射到宿主机），无需改写为容器名。
#   - 镜像由 deploy/docker/Dockerfile.java 基于 maven 已打好的 jar 构建。
#   - 共用环境变量（见 x-common-env）覆盖 CI 模板里的空默认值（如 MySQL 密码）。
#   - -p xfjy-app 保证每次 CI 复用同一 compose 工程名，up -d 只重建变化的容器，不会重复创建。
# ============================================================
name: xfjy-app

x-common-env: &common-env
  TZ: Asia/Shanghai
  MYSQL_USERNAME: xfjy
  MYSQL_PASSWORD: "123456"
  NEO4J_PASSWORD: "itxinfei123456"

services:

  xfjy-gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.java
      args:
        SERVICE: xfjy-gateway
    image: xfjy/xfjy-gateway:latest
    container_name: xfjy-gateway
    network_mode: host
    restart: unless-stopped
    environment: *common-env
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'xfjy-gateway-1.0-SNAPSHOT.jar' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

