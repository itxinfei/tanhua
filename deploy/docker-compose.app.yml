# ============================================================
# 心飞交友 - 后端 Java 服务容器编排（部署用）
#
# 运行（在宿主机，由 Gitea Actions 自动执行）：
#   docker compose -p xfjy-app -f deploy/docker-compose.app.yml --env-file deploy/.env up -d --build
# （deploy/.env 存放真实密码，已被 .gitignore 排除；模板见 deploy/.env.example）
#
# 设计要点：
#   - 所有服务接入同一个 bridge 网络 xfjy-app-net，服务之间用容器名互访；
#     仅网关 8090 端口对外映射（18081~18090 均不外曝，仅内部调用）。
#   - 中间件（MySQL/Redis/Nacos/RocketMQ/Mongo/ES/Neo4j）跑在 xfjy-net，
#     容器通过宿主机 LAN IP 192.168.20.133 访问其映射端口（见 application-local.ci.yml）。
#   - 镜像由 deploy/docker/Dockerfile.java 基于 maven 已打好的 jar 构建。
#   - 共用环境变量（见 x-common-env）覆盖 CI 模板里的空默认值（如 MySQL 密码）。
#   - -p xfjy-app 保证每次 CI 复用同一 compose 工程名，up -d 只重建变化的容器，不会重复创建。
# ============================================================
name: xfjy-app

networks:
  xfjy-app-net:
    name: xfjy-app-net
    driver: bridge

x-common-env: &common-env
  TZ: Asia/Shanghai
  # 中间件地址：容器走 bridge 网络，用宿主机 LAN IP 访问中间件映射端口
  SERVICE_HOST: ${SERVICE_HOST:-192.168.20.133}
  MYSQL_HOST: ${MYSQL_HOST:-192.168.20.133}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_URL: ${MYSQL_URL:-jdbc:mysql://192.168.20.133:3306/xfjy?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
  REDIS_HOST: ${REDIS_HOST:-192.168.20.133}
  REDIS_PORT: ${REDIS_PORT:-6379}
  NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-192.168.20.133:8848}
  MONGODB_URI: ${MONGODB_URI:-mongodb://192.168.20.133:27017/xfjy}
  ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS:-http://192.168.20.133:9200}
  NEO4J_URI: ${NEO4J_URI:-http://192.168.20.133:7474}
  MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
  # 密码禁止入库：真实值由 deploy/.env（gitignore 排除）注入，启动命令须带 --env-file deploy/.env
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-itxinfei123456}
  # RocketMQ（circle/video/recommend 生产消费，name-server 指向宿主映射端口）
  ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-192.168.20.133:9876}
  # match-service 调 xfjy-elasticsearch 服务的 HTTP 接口（区别于 ES 中间件 9200）
  ES_SERVER_URL: ${ES_SERVER_URL:-http://192.168.20.133:18088/es/}
  # MinIO 对象存储（视频/图片上传，凭证留空则上传功能快速失败）
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://192.168.20.133:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
  MINIO_BUCKET: ${MINIO_BUCKET:-test-media}
  MINIO_URL_PREFIX: ${MINIO_URL_PREFIX:-http://192.168.20.133:9000/test-media/}
  # WuKongIM 开源 IM（自托管长连接，替代已下线的环信 Easemob）
  WUKONGIM_API_HOST: ${WUKONGIM_API_HOST:-http://192.168.20.133:5001}
  # 域服务内部鉴权 Token（生产须替换为高强度随机值）
  INTERNAL_AUTH_TOKENS: ${INTERNAL_AUTH_TOKENS:-xfjy-internal-dev-token-change-in-prod}

services:

  xfjy-gateway:
    build:
      context: build/xfjy-gateway
      dockerfile: Dockerfile
    pull_policy: never
    image: xfjy/xfjy-gateway:${IMAGE_TAG:-latest}
    container_name: xfjy-gateway
    ports:
      - "8090:8090"
    networks:
      - xfjy-app-net
    restart: unless-stopped
    environment: *common-env
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'xfjy-gateway-1.0-SNAPSHOT.jar' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

