# ============================================================
# CI 打包用的 application-local.yml 模板
#
# 用途：application-local.yml 被 .gitignore 排除（避免本地真实密码入库），
#      但 CI 构建的 jar 必须携带一份数据源配置，否则服务启动失败：
#      Failed to configure a DataSource: 'url' attribute is not specified
#
# 使用方式（.gitea/workflows/deploy.yml「后端服务打包」阶段）：
#      cp deploy/application-local.ci.yml <module>/src/main/resources/application-local.yml
#
# 所有连接信息均为 默认值 形式：
#   - 默认值已按服务器实际部署填好：
#     · 中间件地址 192.168.20.133（容器走 bridge 网络，用宿主机 LAN IP 访问中间件）
#     · MySQL root/123456、Neo4j itxinfei123456
#     即使运行时未注入环境变量，jar 也能直接连上库；
#   - 如需覆盖，部署时通过容器环境变量传入同名变量即可（优先级最高）。
# ============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.20.133:3306/xfjy?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 192.168.20.133
      port: 6379
      password: 
      timeout: 10s
      lettuce:
        pool:
          max-wait: 5000ms
          max-idle: 100
          min-idle: 10
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.20.133:8848
        username: nacos
        password:
        # base application.yml 默认不注册（本地裸跑避免污染共享注册中心）；
        # CI/容器部署必须注册，否则网关无法发现 BFF、各服务也无法互相发现。
        register-enabled: true

xfjy:
  neo4j:
    # 覆盖 base application.yml 的空默认值，直连运行中 Neo4j 的真实密码
    password: ${NEO4J_PASSWORD:itxinfei123456}
  # 领域服务 base 里默认 127.0.0.1（本地裸跑用）；容器走 bridge 网络 xfjy-app-net，
  # 127.0.0.1 指向 BFF 自身会 Connection refused，必须覆盖为容器名（与 sso 同模式）。
  match:
    service:
      url: http://xfjy-match-service:18082
  user:
    service:
      url: http://xfjy-user-service:18090
  circle:
    service:
      url: http://xfjy-circle-service:18084
  video:
    service:
      url: http://xfjy-video-service:18085
  message:
    service:
      url: http://xfjy-message-service:18086
  sso:
    # Docker 部署必须用容器名：sso 的 18080 端口自 v2.4 起不对外发布（仅网关 8090 暴露），
    # 用宿主机 LAN IP 容器内连不上 → TokenInterceptor 解析用户必失败 → 所有需登录态接口 500。
    # server 与 sso 同在 xfjy-app-net 网络，容器名可直接解析。
    url: http://xfjy-sso:18080
    default:
      user: 2
  pay:
    # 133 为内网测试环境，模拟支付是当前唯一支付通道，开启以便测试 VIP 购买流程；
    # 生产部署通过环境变量 XFJY_PAY_MOCK_CONFIRM_ENABLED=false 覆盖关闭。
    mock-confirm:
      enabled: true
