# ============================================================
# 心飞交友 - Gitea + act_runner（替代 Jenkins 做 CI/CD）
#
# 定位：Gitea 只做 CI，Gitee 仍是主仓库。
#   - Gitea 作为 Gitee 的镜像仓（或手动 push），代码 + .gitea 工作流都在其中
#   - act_runner 跑 Gitea Actions，逻辑与原 Jenkinsfile 完全一致
#   - 部署通道：runner 拉起 job 容器(宿主默认桥接) → SSH 到宿主机 LAN IP 192.168.20.133 → deploy-service.sh
#
# 用法：
#   # 1) 先构建 CI 镜像（必须在宿主机跑，镜像才进宿主 docker，act_runner 才能拉起 job 容器）
#   docker build -f deploy/gitea/Dockerfile.ci -t xfjy/ci:latest deploy/gitea
#   # 2) 在 Gitea 后台「管理 → Runner → 创建 Runner」拿到注册令牌，写入下方 GITEA_RUNNER_TOKEN
#   #    （可放 deploy/gitea/.env，切勿把明文提交进仓库）
#   docker compose -f deploy/docker-compose.gitea.yml --env-file deploy/gitea/.env up -d
# ============================================================
name: xfjy-gitea

networks:
  gitea-net:
    driver: bridge

volumes:
  gitea-data:
  runner-config:

services:

  gitea:
    image: gitea/gitea:1.22
    container_name: xfjy-gitea
    restart: unless-stopped
    environment:
      GITEA__server__APP_DATA_PATH: /data/gitea
      GITEA__server__ROOT_URL: http://192.168.20.133:3000/
      GITEA__server__SSH_DOMAIN: 192.168.20.133
      GITEA__server__SSH_PORT: "2222"
      # 开启 Gitea Actions（CI 必需）
      GITEA__actions__ENABLED: "true"
      # 从 gitea.com 拉取官方 actions（如 actions/checkout）
      GITEA__actions__DEFAULT_ACTIONS_URL: https://gitea.com
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
      - "2222:2222"
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - gitea-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  act_runner:
    image: gitea/act_runner:latest
    container_name: xfjy-act-runner
    restart: unless-stopped
    # GITEA_RUNNER_TOKEN 来自 Gitea 后台「管理 → Runner → 创建 Runner」生成的注册令牌
    environment:
      # 注意：act_runner 读取的变量名是 GITEA_INSTANCE_URL（不是 GITEA_INSTANCE），
      # 写成后者会报 "instance address is empty" 导致 runner 无法注册
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN}
      GITEA_RUNNER_NAME: xfjy-runner
      # 标签 ubuntu-latest 直接映射到我们的 CI 镜像，保证 job 容器含 JDK25/Maven39/Node22/ssh；
      # 工作流里的 container.image 与之保持一致（双保险）。
      GITEA_RUNNER_LABELS: "ubuntu-latest:docker://xfjy/ci:latest"
      # 指向 runner 配置文件（关键：container.network 让 job 容器加入 gitea-net，
      # 否则 job 内 checkout 会报 "Could not resolve host: gitea"）
      CONFIG_FILE: /config/config.yaml
    volumes:
      # 关键：挂载宿主机 docker.sock，使 runner 能拉起 job 容器（工作流里的 container 镜像）
      - /var/run/docker.sock:/var/run/docker.sock
      # runner 注册信息持久化，避免容器重启后需重新注册
      - runner-config:/config
      # runner 配置文件：container.network / labels 等
      - ./gitea/config.yaml:/config/config.yaml:ro
    networks:
      - gitea-net
    depends_on:
      gitea:
        condition: service_healthy
