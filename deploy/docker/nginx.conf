server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 同源反代到网关：前端 baseURL 固定 /api，避免生产 CORS 与构建期地址耦合
    # 尾斜杠会剥掉 /api 前缀，与开发环境 vite proxy 的 rewrite 行为一致
    location /api/ {
        proxy_pass http://192.168.20.133:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 文件上传/IM 长连接场景放宽超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 构建产物静态资源：缺失即 404，绝不回退 index.html。
    # 回退会让缺失的 .js 以 text/html 返回，浏览器报 “Expected a JavaScript-or-Wasm module script
    # but the server responded with a MIME type of "text/html"”，按需加载的页面直接白屏。
    # 同时 assets 带内容哈希，可长缓存；index.html 必须不缓存，保证与 assets 版本一致。
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 路由回退：仅对无扩展名的前端路由（如 /login）回退，刷新时不 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
