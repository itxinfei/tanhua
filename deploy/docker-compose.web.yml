# ============================================================
# 心飞交友 - 前端静态站点容器编排（部署用）
#
# 运行（在宿主机，由 Gitea Actions 自动执行）：
#   docker compose -p xfjy-web -f deploy/docker-compose.web.yml up -d --build
#
# - admin：Vue3 后台管理，容器 80 → 宿主机 5174（沿用本地开发端口，浏览器访问 192.168.20.133:5174）
# - h5：uni-app H5 移动端，容器 80 → 宿主机 5173
# 前端仅提供静态资源；API 走同源 /api，由容器内 nginx 反代到网关 8090。
# 小程序无法容器化，仍走微信开发者工具/公众平台。
# ============================================================
name: xfjy-web

services:

  xfjy-admin:
    build:
      # 最小构建上下文：只含 dist 构建产物 + nginx.conf + Dockerfile
      # 前端构建在 CI 容器内完成（复用 npm 缓存卷），由 stage-artifacts.sh 暂存
      context: build/xfjy-admin
      dockerfile: Dockerfile
    pull_policy: never
    image: xfjy/admin:${IMAGE_TAG:-latest}
    container_name: xfjy-admin
    restart: unless-stopped
    ports:
      - "5174:80"

  xfjy-h5:
    build:
      # 最小构建上下文：只含 dist 构建产物 + nginx.conf + Dockerfile
      # 前端构建在 CI 容器内完成（复用 npm 缓存卷），由 stage-artifacts.sh 暂存
      context: build/xfjy-h5
      dockerfile: Dockerfile
    pull_policy: never
    image: xfjy/h5:${IMAGE_TAG:-latest}
    container_name: xfjy-h5
    restart: unless-stopped
    ports:
      - "5173:80"
