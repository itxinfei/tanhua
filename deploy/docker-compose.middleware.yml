# ============================================================
# 心飞交友中间件一键编排（Linux 服务器）
# 用法：cd deploy && docker compose -f docker-compose.middleware.yml up -d
# 或使用 setup.sh 一键启动 + 初始化数据
# ============================================================

name: xfjy-middleware

networks:
  xfjy-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  es-data:
  es-data9:
  nacos-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-store:
  qdrant-data:
  neo4j-data:
  minio-data:
  wukongim-data:

services:

  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: xfjy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - xfjy-net

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: xfjy-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - xfjy-net

  mongo:
    image: docker.m.daocloud.io/library/mongo:7
    container_name: xfjy-mongo
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - xfjy-net

  elasticsearch:
    image: docker.m.daocloud.io/docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: xfjy-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es-data9:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - xfjy-net

  nacos:
    image: docker.m.daocloud.io/nacos/nacos-server:v3.0.0
    container_name: xfjy-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      # Nacos 3.x 启动脚本强制校验以下三项（即使关闭鉴权也必须设置）
      NACOS_AUTH_TOKEN: "SecretKey012345678901234567890123456789012345678901234567890123456789"
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "security"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      # Nacos 3.x 无 /v1/console/health/readiness 端点，用首页 302 判断存活
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8848/nacos || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - xfjy-net

  rocketmq-namesrv:
    image: docker.m.daocloud.io/apache/rocketmq:5.3.1
    container_name: xfjy-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx256m"
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    networks:
      - xfjy-net

  rocketmq-broker:
    image: docker.m.daocloud.io/apache/rocketmq:5.3.1
    container_name: xfjy-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - rocketmq-broker-store:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf:ro
    networks:
      - xfjy-net

  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:v1.12.0
    container_name: xfjy-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - xfjy-net

  neo4j:
    image: docker.m.daocloud.io/library/neo4j:5
    container_name: xfjy-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-itxinfei123456}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      TZ: Asia/Shanghai
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - xfjy-net

  minio:
    # 对象存储（替代阿里云 OSS）：S3 API 9000，管理控制台 9001
    image: docker.m.daocloud.io/minio/minio:latest
    container_name: xfjy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - xfjy-net

  minio-init:
    # 一次性任务：创建业务桶 test-media 并设为公开下载（匿名可读），与 server minio.bucketName 对齐
    image: docker.m.daocloud.io/minio/mc:latest
    container_name: xfjy-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      BUCKET_NAME: test-media
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${BUCKET_NAME};
      mc anonymous set download local/$${BUCKET_NAME};
      echo 'minio bucket ready:';
      mc ls local;
      "
    networks:
      - xfjy-net

  # CI/CD 已迁移到 Gitea：见 deploy/docker-compose.gitea.yml（xfjy-gitea + xfjy-act-runner）

  wukongim:
    # 即时消息/信令通道（替代环信）：HTTP API 5001、TCP 5100、WebSocket 5200、管理台 5300
    image: docker.m.daocloud.io/wukongim/wukongim:latest
    container_name: xfjy-wukongim
    restart: unless-stopped
    environment:
      WK_MODE: release
      WK_EXTERNAL_IP: ${WUKONGIM_EXTERNAL_IP:-192.168.20.133}
      TZ: Asia/Shanghai
    ports:
      - "5001:5001"
      - "5100:5100"
      - "5200:5200"
      - "5300:5300"
    volumes:
      - wukongim-data:/root/wukongim
    healthcheck:
      # WuKongIM v1.2.x 无 /health 端点，用 Monitor web(5300/web, 301) 判断存活
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5300/web || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - xfjy-net

  livekit:
    # 音视频 SFU 媒体服务器（替代环信音视频）：信令 7880、TCP 回退 7881、UDP 媒体 50000-60000
    image: docker.m.daocloud.io/livekit/livekit-server:latest
    container_name: xfjy-livekit
    restart: unless-stopped
    command: --config /etc/livekit/config.yaml
    environment:
      TZ: Asia/Shanghai
      # 密钥单一事实源在 deploy/.env：经 LIVEKIT_KEYS 注入，格式 "<key>: <secret>"
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-xfjykey}: ${LIVEKIT_API_SECRET:-CHANGE_ME_TO_RANDOM_SECRET_32_CHARS_MIN}"
      # 内网部署固定节点 IP、关闭 STUN 公网探测（环境变量优先级高于 config.yaml）
      LIVEKIT_RTC_USE_EXTERNAL_IP: "${LIVEKIT_USE_EXTERNAL_IP:-false}"
      LIVEKIT_RTC_NODE_IP: "${LIVEKIT_NODE_IP:-192.168.20.133}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit/config.yaml:/etc/livekit/config.yaml:ro
    networks:
      - xfjy-net
