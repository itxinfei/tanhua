# ============================================================
# act_runner 配置（Gitea Actions runner）
#
# 关键项 container.network：
#   act_runner 默认给每个 job 建一个独立网络，该网络里没有 gitea 服务名，
#   导致 job 内 checkout 时 "Could not resolve host: gitea" 而失败。
#   这里让 job 容器直接加入 gitea 所在的 gitea-net，
#   job 内即可用 http://gitea:3000 拉取代码、调用 Gitea API。
# ============================================================
log:
  level: info

runner:
  file: .runner
  # 并发 2：ci.yml 的 backend/admin/app 三个 job 可两两并行（缩短门禁墙钟时间）；
  # deploy 与 ci 同时触发时也只排一个，不再长时间串行等待。
  # 宿主机同时跑全套中间件+11个Java容器，不建议再调高，避免构建抢垮线上服务。
  capacity: 2
  timeout: 3h
  # 标签映射：ubuntu-latest 指向本项目自建的 CI 镜像
  labels:
    - "ubuntu-latest:docker://xfjy/ci:latest"

cache:
  enabled: true

container:
  network: "xfjy-gitea_gitea-net"
  privileged: false
  # Runner 5.x 默认 sweep=true：job 结束强删"经 Docker proxy 创建"的容器/网络/卷。
  # 本项目 job 用 docker compose 部署的是常驻微服务，会被误删（2026-11-02 run#119 事故根因）。
  # 官方说明：jobs deploy services to the runner Docker daemon 时必须设为 false。
  sweep: false
  # 允许挂载进 job 容器的宿主路径白名单。
  # 关键：act_runner 只认这个白名单，config.yaml 的 container.options 里写 -v 无效
  #       （实测 options 里的 -v 从未生效：宿主 .cache/m2 一直是空的）。
  #       真正生效的方式是在 workflow 的 container.volumes 里声明，
  #       且此处白名单必须包含对应路径。
  # 注意：workflow 里已由 act_runner 默认挂载 docker.sock，
  #       所以 workflow 的 volumes 里不要再重复声明 /var/run/docker.sock
  #       （否则报 "Duplicate mount point" 导致容器创建失败）。
  valid_volumes:
    - "/var/run/docker.sock"
    - "/home/itxinfei/.cache/m2"
    - "/home/itxinfei/.cache/npm"
    - "/home/itxinfei/.cache/ci-state"
  # 关键项说明：
  # 1) --add-host 已删除：container.network 使用 gitea-net 后 Docker 内嵌 DNS 能正确解析 gitea 服务名，
  #    无需额外的 /etc/hosts 注入。旧配置 --add-host gitea:172.19.0.2 的 IP 现已失效（Gitea 容器 IP 变动），
  #    保留反而让 job 容器把 gitea 解析到错误地址。
  #
  # 2) 资源限制：4 核 / 4G，够跑 Maven 并行构建
  options: "--cpus=4 --memory=4g"

