# ============================================================
# act_runner 配置（Gitea Actions runner）
#
# 关键项 container.network：
#   act_runner 默认给每个 job 建一个独立网络，该网络里没有 gitea 服务名，
#   导致 job 内 checkout 时 "Could not resolve host: gitea" 而失败。
#   这里让 job 容器直接加入 gitea 所在的 gitea-net，
#   job 内即可用 http://gitea:3000 拉取代码、调用 Gitea API。
# ============================================================
log:
  level: info

runner:
  file: .runner
  capacity: 1
  timeout: 3h
  # 标签映射：ubuntu-latest 指向本项目自建的 CI 镜像
  labels:
    - "ubuntu-latest:docker://xfjy/ci:latest"

cache:
  enabled: true

container:
  network: "xfjy-gitea_gitea-net"
  privileged: false
  # job 容器内需要挂载宿主 docker.sock（act_runner 默认已挂载，此处显式声明以便 job 内执行 docker/compose）
  valid_volumes:
    - "/var/run/docker.sock"
  # 关键项说明：
  # 1) --add-host gitea:172.19.0.2
  #    act_runner 给每个 job 自建独立网络，该网络内没有 gitea 服务名，
  #    导致 checkout 时 "Could not resolve host: gitea"。这里用 --add-host 兜底，
  #    172.19.0.2 是 gitea 容器在 xfjy-gitea_gitea-net 上的地址。
  #
  # 2) -v /home/itxinfei/.cache/m2:/root/.m2/repository
  #    job 容器每次都是全新的，Maven 依赖会重新下载（150MB+），挂载宿主缓存后可跨 job 复用。
  #    注意必须挂到 /root/.m2/repository 而不是 /root/.m2：
  #    挂整个 /root/.m2 会把镜像内预置的 settings.xml（阿里云镜像源）整个覆盖掉，
  #    导致 Maven 退回中央仓库直连（国内极慢 / 超时）。
  #    另外 act 的 checkout 步骤会临时改写 HOME，导致 Maven 默认本地仓库路径漂移，
  #    所以 workflow 里显式加了 -Dmaven.repo.local=/root/.m2/repository 锁定位置。
  #
  # 3) -v /home/itxinfei/.cache/npm:/root/.npm
  #    npm 依赖缓存，同样跨 job 复用。
  #
  # 4) -v /home/itxinfei/.cache/ci-state:/opt/ci-state
  #    增量构建的持久化状态：源码指纹基线 + jar 产物缓存。
  #    没有它每次都会退化成全量重建，增量编译就失去意义。
  options: "--cpus=4 --memory=4g --add-host gitea:172.19.0.2 -v /home/itxinfei/.cache/m2:/root/.m2/repository -v /home/itxinfei/.cache/npm:/root/.npm -v /home/itxinfei/.cache/ci-state:/opt/ci-state"
