server:
  port: 18086

spring:
  application:
    name: xfjy-message-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
  profiles:
    active: local

# 环信 IM 服务端配置（REST API 对接，huanxin 通道时启用）
# 凭证通过环境变量注入，禁止硬编码入库；本地开发在 application-local.yml 中覆盖
huanxin:
  appkey: ${HANXIN_APPKEY:xfjy#xfjy}
  client-id: ${HANXIN_CLIENT_ID:}
  client-secret: ${HANXIN_CLIENT_SECRET:}
  rest-host: ${HANXIN_REST_HOST:https://a1.easemob.com}

# WuKongIM 开源 IM 服务端配置（REST API 对接，wukongim 通道默认启用）
# API 无需鉴权（内部系统专用），仅需服务地址；端口 5001 与 docker-compose.middleware.yml 对应
wukongim:
  api-host: ${WUKONGIM_API_HOST:http://192.168.20.133:5001}