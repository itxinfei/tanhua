server:
  port: 18086

spring:
  application:
    name: xfjy-message-service
  profiles:
    active: local

# 环信 IM 服务端配置（REST API 对接）
# 凭证通过环境变量注入，禁止硬编码入库；本地开发在 application-local.yml 中覆盖
huanxin:
  appkey: ${HANXIN_APPKEY:xfjy#xfjy}
  client-id: ${HANXIN_CLIENT_ID:}
  client-secret: ${HANXIN_CLIENT_SECRET:}
  rest-host: ${HANXIN_REST_HOST:https://a1.easemob.com}