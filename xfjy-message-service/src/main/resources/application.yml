server:
  port: 18086

spring:
  application:
    name: xfjy-message-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.20.133:8848
        username: nacos
        password: nacos
        namespace:
  profiles:
    active: local

# 内部服务鉴权 Token（可选逗号分隔，生产环境建议通过 INTERNAL_AUTH_TOKENS 环境变量注入覆盖）
internal:
  auth:
    tokens: xfjy-internal-dev-token-change-in-prod

# WuKongIM 开源 IM 服务端配置（REST API 对接）
# API 无需鉴权（内部系统专用），仅需服务地址；端口 5001 与 docker-compose.middleware.yml 对应
wukongim:
  api-host: http://192.168.20.133:5001