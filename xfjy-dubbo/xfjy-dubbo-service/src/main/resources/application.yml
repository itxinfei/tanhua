server:
  port: 18083

spring:
  application:
    name: xfjy-dubbo-service
  profiles:
    active: local
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/xfjy
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-wait: 5000ms
          max-idle: 100
          min-idle: 10

# ES服务地址（ES模块的HTTP接口）
es:
  server:
    url: http://172.168.20.221/es/