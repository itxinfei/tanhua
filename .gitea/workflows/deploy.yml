# ============================================================
# 心飞交友 - Gitea Actions 部署流水线（Docker 化）
#
# 触发：
#   - push 到 master（Gitee 推送后镜像同步进 Gitea，产生 push 事件触发，详见 deploy/gitea/GITEE_WEBHOOK.md）
#   - 手动：Gitea 仓库 Actions 页 → Run workflow
#       · deploy       : 是否执行部署（false 仅打包校验，不构建/运行容器）
#       · deploy_web   : 是否同时部署前端(admin+h5)容器
#
# 阶段：
#   1) 后端 Maven 编译
#   2) 后端服务打包（为 11 个 Spring Boot 应用注入 application-local.yml 并校验 jar）
#   3) 构建并部署 Java 服务容器（docker compose up -d --build，必选）
#   4) 构建并部署前端容器（docker compose up -d --build，容错，失败不影响后端）
#
# 部署模型：
#   - job 容器挂载 /var/run/docker.sock，直接调用宿主机 docker 构建镜像并运行容器（单主机，免 registry）。
#   - Java 服务用 network_mode: host，复用既有 127.0.0.1 中间件连接串；前端用 nginx 容器 + 端口映射。
#   - 约定：CI 只构建与部署，不向 Gitee 写回任何东西。
# ============================================================
name: deploy

# ── 触发器 ──────────────────────────────────────────────────
# 注意（Gitea 1.22 兼容性）：Gitea 内置的 act v0.259.1 在解析 on: 时，
# 会把每个事件的值当作"分支过滤条件"处理。若在 workflow_dispatch 下写 inputs，
# 会触发 "unknown on type" 并导致整个 workflow 被忽略（push 也不再触发）。
# 因此 dispatch 参数统一放在顶层 inputs:，on.workflow_dispatch 留空。
on:
  push:
    branches: [master]
  workflow_dispatch:

# 手动触发的输入项（Gitea 1.22 顶层 inputs 语法）
inputs:
  deploy:
    description: '是否执行部署（false 仅构建校验，不部署）'
    required: true
    default: 'true'
  deploy_web:
    description: '是否同时部署前端(admin + h5)容器'
    required: true
    default: 'true'

env:
  DEPLOY: ${{ github.event.inputs.deploy || 'true' }}
  DEPLOY_WEB: ${{ github.event.inputs.deploy_web || 'true' }}
  # 11 个可部署 Spring Boot 应用（xfjy-api 仅为接口库，不打包）
  SERVICES: "xfjy-gateway xfjy-sso xfjy-user-service xfjy-circle-service xfjy-video-service xfjy-match-service xfjy-message-service xfjy-server xfjy-recommend xfjy-elasticsearch xfjy-pay-service"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 说明：act_runner 已默认把宿主 /var/run/docker.sock 挂进 job 容器，
    # 这里不能再声明 volumes，否则会出现 "Duplicate mount point" 导致容器创建失败。
    container:
      image: xfjy/ci:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 后端 Maven 编译
        run: mvn -B -ntp compile -DskipTests

      - name: 后端服务打包（注入 application-local.yml）
        run: |
          set -e
          for svc in $SERVICES; do
            RES="$svc/src/main/resources"
            if [ -f "$RES/application.yml" ]; then
              [ -f "$RES/application-local.yml" ] || cp -f deploy/application-local.ci.yml "$RES/application-local.yml"
            fi
          done
          mvn -B -ntp package -DskipTests -pl "$SERVICES" -am
          for svc in $SERVICES; do
            if [ ! -f "$svc/target/$svc-1.0-SNAPSHOT.jar" ]; then
              echo "ERROR: 未生成 $svc/target/$svc-1.0-SNAPSHOT.jar"; exit 1
            fi
            echo "OK jar: $svc"
          done

      - name: 构建并部署 Java 服务容器
        if: ${{ env.DEPLOY != 'false' }}
        env:
          # 中间件真实密码：优先用 Gitea Actions Secrets（仓库设置 → Actions → Secrets）
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME || 'root' }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          set -e
          if [ -z "${MYSQL_PASSWORD}" ]; then
            echo "[ERROR] 未配置 Secrets.MYSQL_PASSWORD，服务将无法连接数据库"
            echo "       请在 Gitea 仓库 → Settings → Actions → Secrets 添加 MYSQL_PASSWORD"
            exit 1
          fi
          # deploy/.env 被 .gitignore 排除，仓库里没有；密码从 Secrets 注入到临时 env 文件
          umask 077
          printf 'MYSQL_USERNAME=%s\nMYSQL_PASSWORD=%s\nNEO4J_PASSWORD=%s\n' \
            "${MYSQL_USERNAME}" "${MYSQL_PASSWORD}" "${NEO4J_PASSWORD}" > deploy/.env
          docker compose -p xfjy-app -f deploy/docker-compose.app.yml --env-file deploy/.env up -d --build
          rm -f deploy/.env

      - name: 构建并部署前端容器（容错）
        continue-on-error: true
        if: ${{ env.DEPLOY != 'false' && env.DEPLOY_WEB != 'false' }}
        run: |
          set -e
          docker compose -p xfjy-web -f deploy/docker-compose.web.yml up -d --build
