# ============================================================
# 心飞交友 - Gitea Actions 部署流水线（Docker 化 + 增量构建）
#
# 触发方式：
#   1) 自动：push 到 master → 自动增量编译打包 → 只重建受影响容器
#   2) 手动：Gitea 仓库 Actions 页 → Run workflow，可指定动作与服务范围
#
# 手动输入项：
#   action    : deploy(默认) | build | start | stop | restart | status | logs
#   services  : 空格分隔的服务名；留空 = 按变更范围自动推断（全量时 = 全部）
#               后端微服务：xfjy-gateway xfjy-sso xfjy-user-service xfjy-circle-service
#                         xfjy-video-service xfjy-match-service xfjy-message-service
#                         xfjy-server xfjy-recommend xfjy-elasticsearch xfjy-pay-service
#               前端：admin(xfjy-admin) / app(xfjy-h5)
#   skip_ci   : true = 跳过编译打包（仅对已有产物做启停等操作）
#   full_build: true = 强制全量重建（忽略增量判定）
#
# 增量构建原理：
#   1. 对每个 Maven 模块 / 前端目录计算源码指纹（文件内容 SHA256 汇总）
#   2. 与上次构建写入的指纹基线比对 → 得到变更模块
#   3. 沿模块依赖图做反向闭包（改 xfjy-api 会牵连所有依赖它的服务）
#   4. 只对受影响模块跑 mvn package；未受影响的 jar 从产物缓存还原
#   5. 只重建受影响服务的镜像与容器，其余容器原地不动（不重启、不重打）
#
# Maven 依赖源：
#   - 使用仓库内 deploy/ci/settings.xml（阿里云镜像优先 + 官方源兜底）
#   - 显式指定 localRepository 到持久化挂载目录，实现跨任务复用依赖
#
# 部署模型：
#   - job 容器内挂载宿主 /var/run/docker.sock（act_runner 默认已挂载），
#     直接驱动宿主机 docker 构建镜像并运行容器，单主机免 registry。
#   - 约定：CI 只构建与部署，不向 Gitee 写回任何东西。
# ============================================================
name: deploy

# ── 触发器 ──────────────────────────────────────────────────
# 注意（Gitea 1.22 兼容性）：Gitea 内置的 act v0.259.1 在解析 on: 时，
# 会把每个事件的值当作"分支过滤条件"处理。若在 workflow_dispatch 下写 inputs，
# 会触发 "unknown on type" 并导致整个 workflow 被忽略（push 也不再触发）。
# 因此 dispatch 参数统一放在顶层 inputs:，on.workflow_dispatch 留空。
on:
  push:
    branches: [master]
  workflow_dispatch:

# 手动触发的输入项（Gitea 1.22 顶层 inputs 语法）
inputs:
  action:
    description: '动作：deploy(默认,增量构建并部署) | build(仅构建) | start | stop | restart | status | logs'
    required: true
    default: 'deploy'
  services:
    description: '服务名，空格分隔；留空表示按变更范围自动推断'
    required: false
    default: ''
  skip_ci:
    description: 'true = 跳过编译打包，仅对已有容器做启停操作'
    required: false
    default: 'false'
  full_build:
    description: 'true = 强制全量重建，忽略增量判定'
    required: false
    default: 'false'

env:
  ACTION: ${{ github.event.inputs.action || 'deploy' }}
  TARGET_SERVICES: ${{ github.event.inputs.services || '' }}
  SKIP_CI: ${{ github.event.inputs.skip_ci || 'false' }}
  FULL_BUILD: ${{ github.event.inputs.full_build || 'false' }}
  # 11 个可部署 Spring Boot 应用（xfjy-api 仅为接口库，不打包）
  SERVICES: "xfjy-gateway xfjy-sso xfjy-user-service xfjy-circle-service xfjy-video-service xfjy-match-service xfjy-message-service xfjy-server xfjy-recommend xfjy-elasticsearch xfjy-pay-service"
  # 持久化状态目录（宿主挂载）：存指纹基线 + jar 产物缓存
  CI_STATE_DIR: /opt/ci-state
  # Maven 参数：仓库内阿里云镜像 settings + 显式本地仓库路径（跨任务复用依赖）
  MVN_ARGS: "-B -ntp -s deploy/ci/settings.xml -Dmaven.repo.local=/root/.m2/repository"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 说明：act_runner 已默认把宿主 /var/run/docker.sock 挂进 job 容器，
    # 这里不能再声明 volumes，否则会出现 "Duplicate mount point" 导致容器创建失败。
    container:
      image: xfjy/ci:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 判定增量构建范围
        if: ${{ env.SKIP_CI != 'true' }}
        run: |
          set -e
          chmod +x deploy/ci/*.sh
          bash deploy/ci/incremental-build.sh
          echo "---- 判定结果 ----"
          cat "${CI_STATE_DIR}/affected.env"

      - name: 编译打包（仅受影响模块）
        if: ${{ env.SKIP_CI != 'true' }}
        run: |
          set -e
          # shellcheck disable=SC1091
          . "${CI_STATE_DIR}/affected.env"
          BUILD_LIST="${BUILD_MODULES}"
          if [ -z "${BUILD_LIST}" ]; then
            echo "[增量] 无模块需要重新编译，全部复用已有产物"
            exit 0
          fi
          # 为参与打包的模块注入 CI 环境配置
          for m in ${BUILD_LIST}; do
            RES="$m/src/main/resources"
            if [ -f "$RES/application.yml" ]; then
              cp -f deploy/application-local.ci.yml "$RES/application-local.yml"
            fi
          done
          PL_LIST="$(echo ${BUILD_LIST} | tr ' ' ',')"
          echo "[增量] 打包模块: ${PL_LIST}"
          # -am 带出上游依赖（如 xfjy-api），保证被依赖模块是最新的
          # -T 1C 按 CPU 核数并行构建，进一步缩短耗时
          mvn ${MVN_ARGS} package -DskipTests -Dmaven.test.skip=true \
              -pl "${PL_LIST}" -am -T 1C
          for m in ${BUILD_LIST}; do
            if [ ! -f "$m/target/$m-1.0-SNAPSHOT.jar" ]; then
              echo "ERROR: 未生成 $m/target/$m-1.0-SNAPSHOT.jar"; exit 1
            fi
            echo "OK jar: $m"
          done

      - name: 缓存构建产物与指纹基线
        if: ${{ env.SKIP_CI != 'true' && success() }}
        run: bash deploy/ci/cache-artifacts.sh save

      - name: 准备部署参数（注入中间件密码）
        if: ${{ env.SKIP_CI != 'true' && env.ACTION == 'deploy' }}
        env:
          # 中间件真实密码：来自 Gitea Actions Secrets（仓库设置 → Actions → Secrets）
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME || 'root' }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          set -e
          if [ -z "${MYSQL_PASSWORD}" ]; then
            echo "[ERROR] 未配置 Secrets.MYSQL_PASSWORD，服务将无法连接数据库"
            echo "       请在 Gitea 仓库 → Settings → Actions → Secrets 添加 MYSQL_PASSWORD"
            exit 1
          fi
          # deploy/.env 被 .gitignore 排除，仓库里没有；密码从 Secrets 注入到临时 env 文件
          umask 077
          printf 'MYSQL_USERNAME=%s\nMYSQL_PASSWORD=%s\nNEO4J_PASSWORD=%s\n' \
            "${MYSQL_USERNAME}" "${MYSQL_PASSWORD}" "${NEO4J_PASSWORD}" > deploy/.env

      - name: 执行部署动作
        if: ${{ env.SKIP_CI != 'true' || env.ACTION != 'deploy' }}
        run: |
          set -e
          chmod +x deploy/manage.sh
          # 目标服务：手动指定优先；否则按增量判定结果（后端 + 前端）
          TARGETS="${TARGET_SERVICES}"
          if [ -z "${TARGETS}" ] && [ "${SKIP_CI}" != "true" ]; then
            # shellcheck disable=SC1091
            . "${CI_STATE_DIR}/affected.env"
            TARGETS="${BACKEND_AFFECTED} ${FRONTEND_AFFECTED}"
          fi
          echo "[CI] 目标服务: ${TARGETS:-（全部）}"
          # shellcheck disable=SC2086
          case "${ACTION}" in
            deploy)
              bash deploy/manage.sh deploy ${TARGETS}
              ;;
            build)
              bash deploy/manage.sh build ${TARGETS}
              ;;
            start|up)
              bash deploy/manage.sh start ${TARGETS}
              ;;
            stop|down)
              bash deploy/manage.sh stop ${TARGETS}
              ;;
            restart)
              bash deploy/manage.sh restart ${TARGETS}
              ;;
            status)
              bash deploy/manage.sh status
              ;;
            logs)
              bash deploy/manage.sh logs ${TARGETS}
              ;;
            *)
              echo "[ERROR] 未知 action: ${ACTION}"; exit 1
              ;;
          esac

      - name: 输出部署后状态
        if: ${{ always() }}
        run: bash deploy/manage.sh status

      - name: 清理临时密码文件
        if: ${{ always() }}
        run: rm -f deploy/.env
