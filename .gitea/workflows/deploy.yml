# ============================================================
# 心飞交友 - 部署流水线（Docker 化 + 增量构建 + 健康检查）
#
# 触发方式：
#   1) 自动：push 到 master → 自动增量编译打包 → 只重建受影响容器 → 健康检查
#   2) 手动：Gitea 仓库 Actions 页 → Run workflow，可指定动作与服务范围
#
# 手动输入项：
#   action    : deploy(默认) | build | start | stop | restart | status | logs
#   services  : 空格分隔的服务名；留空 = 按变更范围自动推断
#               后端微服务：xfjy-gateway xfjy-sso xfjy-user-service xfjy-circle-service
#                         xfjy-video-service xfjy-match-service xfjy-message-service
#                         xfjy-server xfjy-recommend xfjy-elasticsearch xfjy-pay-service
#               前端：admin(xfjy-admin) / app(xfjy-h5)
#   skip_ci   : true = 跳过编译打包（仅对已有产物做启停等操作）
#   full_build: true = 强制全量重建（忽略增量判定）
#
# 增量构建原理：
#   1. 对每个 Maven 模块 / 前端目录计算源码指纹（文件内容 SHA256 汇总）
#   2. 与上次构建写入的指纹基线比对 → 得到变更模块
#   3. 沿模块依赖图做反向闭包（改 xfjy-api 会牵连所有依赖它的服务）
#   4. 只对受影响模块跑 mvn package；未受影响的 jar 从产物缓存还原
#   5. 只重建受影响服务的镜像与容器，其余容器原地不动
#
# 部署后健康检查：
#   - 等待容器达到 healthy 状态（超时 60s）
#   - 探测网关 /admin/ 接口是否可访问
#   - 检查失败时输出日志但不阻断（手动排查用）
# ============================================================
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

inputs:
  action:
    description: '动作：deploy(默认,增量构建并部署) | build(仅构建) | start | stop | restart | status | logs'
    required: true
    default: 'deploy'
  services:
    description: '服务名，空格分隔；留空表示按变更范围自动推断'
    required: false
    default: ''
  skip_ci:
    description: 'true = 跳过编译打包，仅对已有容器做启停操作'
    required: false
    default: 'false'
  full_build:
    description: 'true = 强制全量重建，忽略增量判定'
    required: false
    default: 'false'

env:
  ACTION: ${{ github.event.inputs.action || 'deploy' }}
  TARGET_SERVICES: ${{ github.event.inputs.services || '' }}
  SKIP_CI: ${{ github.event.inputs.skip_ci || 'false' }}
  FULL_BUILD: ${{ github.event.inputs.full_build || 'false' }}
  # 11 个可部署 Spring Boot 应用（xfjy-api 仅为接口库，不打包）
  SERVICES: "xfjy-gateway xfjy-sso xfjy-user-service xfjy-circle-service xfjy-video-service xfjy-match-service xfjy-message-service xfjy-server xfjy-recommend xfjy-elasticsearch xfjy-pay-service"
  CI_STATE_DIR: /opt/ci-state
  MVN_ARGS: "-B -ntp -s deploy/ci/settings.xml -Dmaven.repo.local=/root/.m2/repository"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: xfjy/ci:latest
      volumes:
        - /home/itxinfei/.cache/m2:/root/.m2/repository
        - /home/itxinfei/.cache/npm:/root/.npm
        - /home/itxinfei/.cache/ci-state:/opt/ci-state

    steps:
      - name: Checkout
        run: |
          set -e
          mkdir -p /ci
          cd /ci
          git clone --depth 1 http://gitea:3000/admin/xfjy.git .
          git log -1 --oneline

      # ── 增量构建范围判定 ──────────────────────────────────
      - name: 判定增量构建范围
        if: ${{ env.SKIP_CI != 'true' }}
        run: |
          set -e
          cd /ci
          chmod +x deploy/ci/*.sh
          bash deploy/ci/incremental-build.sh
          echo "---- 判定结果 ----"
          cat "${CI_STATE_DIR}/affected.env"

      # ── 编译打包（仅受影响模块） ─────────────────────────
      - name: 编译打包
        if: ${{ env.SKIP_CI != 'true' }}
        run: |
          set -e
          cd /ci
          # shellcheck disable=SC1091
          . "${CI_STATE_DIR}/affected.env"
          BUILD_LIST="${BUILD_MODULES}"
          if [ -z "${BUILD_LIST}" ]; then
            echo "[增量] 无模块需要重新编译，全部复用已有产物"
            exit 0
          fi
          # 为参与打包的模块注入 CI 环境配置
          for m in ${BUILD_LIST}; do
            RES="$m/src/main/resources"
            if [ -f "$RES/application.yml" ]; then
              cp -f deploy/application-local.ci.yml "$RES/application-local.yml"
            fi
          done
          PL_LIST="$(echo ${BUILD_LIST} | tr ' ' ',')"
          echo "[增量] 打包模块: ${PL_LIST}"
          # -T 2 而非 -T 1C：宿主机同时跑全套中间件与线上容器，全核并行会把
          # CPU 打满导致面板/线上服务一起卡；限 2 线程用时间换整机流畅
          MAVEN_OPTS="-Xmx1g" mvn ${MVN_ARGS} package -DskipTests -Dmaven.test.skip=true \
              -pl "${PL_LIST}" -am -T 2
          for m in ${BUILD_LIST}; do
            if [ ! -f "$m/target/$m-1.0-SNAPSHOT.jar" ]; then
              echo "ERROR: 未生成 $m/target/$m-1.0-SNAPSHOT.jar"; exit 1
            fi
            echo "OK jar: $m"
          done

      # ── 缓存构建产物与指纹基线 ────────────────────────────
      - name: 缓存构建产物与指纹基线
        if: ${{ env.SKIP_CI != 'true' && success() }}
        run: |
          cd /ci
          bash deploy/ci/cache-artifacts.sh save

      # ── 构建前端（CI 容器内，复用 npm 缓存卷；admin/h5 并行） ──
      # 提速原理：CI job 容器挂载了 /root/.npm 缓存卷，npm ci --prefer-offline
      #          优先走本地缓存秒级装依赖；构建产物 dist 直接暂存进镜像，
      #          Docker build 退化为 COPY dist → nginx，秒级出镜像。
      #          旧方式在 Docker build 内 npm ci，构建容器吃不到缓存卷，每次 3-8 分钟。
      - name: 构建前端
        if: ${{ env.SKIP_CI != 'true' && success() }}
        run: |
          set -e
          cd /ci
          # shellcheck disable=SC1091
          . "${CI_STATE_DIR}/affected.env"
          if [ -z "${FRONTEND_AFFECTED}" ]; then
            echo "[增量] 无前端变更，跳过前端构建"
            exit 0
          fi
          # runner 容器自带 Node 22.11.0，不满足 rolldown/sass-embedded 原生二进制包的
          # engines >=22.12.0 要求，npm ci 会静默跳过这些 optionalDependencies，导致构建报
          # "Cannot find module '@rolldown/binding-linux-x64-gnu'"。
          # 用 n 升级到 22.14.0 LTS（npmmirror 镜像加速，约 10-20s）。
          # 镜像 Node 装在 /opt/node（PATH 优先于 /usr/local/bin），n 默认装 /usr/local
          # 会被忽略，须指定 N_PREFIX=/opt/node 原位覆盖。
          export N_NODE_MIRROR=https://npmmirror.com/mirrors/node
          export N_PREFIX=/opt/node
          npm install -g n --no-audit --no-fund --prefer-offline
          n 22.14.0
          hash -r
          echo "[前端] Node 版本: $(node --version)"
          echo "[前端] 受影响工程: ${FRONTEND_AFFECTED}"
          PIDS=""
          # admin / h5 互不依赖，并行构建
          for fe in ${FRONTEND_AFFECTED}; do
            case "${fe}" in
              xfjy-admin)
                echo "[前端] xfjy-admin 构建中..."
                ( cd xfjy-admin \
                  && npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund \
                  && npm run build ) > /tmp/build-admin.log 2>&1 &
                PIDS="$PIDS $!" ;;
              xfjy-h5)
                echo "[前端] xfjy-app(H5) 构建中..."
                ( cd xfjy-app \
                  && npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund \
                  && npm run build:h5 ) > /tmp/build-h5.log 2>&1 &
                PIDS="$PIDS $!" ;;
            esac
          done
          FAIL=0
          for p in ${PIDS}; do
            wait "${p}" || FAIL=1
          done
          echo "---- xfjy-admin 构建日志（尾部）----"
          tail -30 /tmp/build-admin.log 2>/dev/null || true
          echo "---- xfjy-app(H5) 构建日志（尾部）----"
          tail -30 /tmp/build-h5.log 2>/dev/null || true
          if [ "${FAIL}" != "0" ]; then
            echo "[ERROR] 前端构建失败，完整日志见上"
            exit 1
          fi
          # 校验构建产物
          for fe in ${FRONTEND_AFFECTED}; do
            case "${fe}" in
              xfjy-admin) [ -f xfjy-admin/dist/index.html ] || { echo "ERROR: xfjy-admin/dist/index.html 缺失"; exit 1; } ;;
              xfjy-h5)    [ -f xfjy-app/dist/build/h5/index.html ] || { echo "ERROR: xfjy-app/dist/build/h5/index.html 缺失"; exit 1; } ;;
            esac
          done
          echo "[前端] 构建完成"

      # ── 暂存构建上下文 ────────────────────────────────────
      - name: 暂存构建上下文
        if: ${{ env.SKIP_CI != 'true' && success() }}
        run: |
          set -e
          cd /ci
          # shellcheck disable=SC1091
          . "${CI_STATE_DIR}/affected.env"
          bash deploy/ci/stage-artifacts.sh ${BACKEND_AFFECTED}
          if [ -n "${FRONTEND_AFFECTED}" ]; then
            bash deploy/ci/stage-artifacts.sh --frontend-only
          fi
          echo "---- 暂存结果 ----"
          du -sh deploy/build/* 2>/dev/null || true

      # ── 解析并记录镜像标签 ──────────────────────────────
      - name: 解析并记录镜像标签
        if: ${{ env.ACTION == 'deploy' }}
        id: tag
        run: |
          set -e
          cd /ci
          if git describe --tags --exact-match >/dev/null 2>&1; then
            TAG="$(git describe --tags --exact-match)"
          else
            TAG="$(git rev-parse --short HEAD)"
          fi
          echo "IMAGE_TAG=${TAG}" >> "${GITHUB_OUTPUT:-/dev/stdout}"
          echo "${TAG}" > "${CI_STATE_DIR}/last-deploy-tag"
          echo "[tag] 镜像标签: ${TAG}（已记录到 last-deploy-tag，供 rollback 使用）"

      # ── 准备部署参数（注入中间件密码 + 镜像标签） ──────────
      - name: 准备部署参数
        if: ${{ env.ACTION == 'deploy' }}
        env:
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME || 'root' }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -e
          cd /ci
          if [ -z "${MYSQL_PASSWORD}" ]; then
            echo "[ERROR] 未配置 Secrets.MYSQL_PASSWORD"
            exit 1
          fi
          [ -z "${MINIO_ACCESS_KEY}" ] && echo "[WARN] 未配置 Secrets.MINIO_ACCESS_KEY"
          umask 077
          {
            printf 'MYSQL_USERNAME=%s\n' "${MYSQL_USERNAME}"
            printf 'MYSQL_PASSWORD=%s\n' "${MYSQL_PASSWORD}"
            printf 'NEO4J_PASSWORD=%s\n' "${NEO4J_PASSWORD}"
            printf 'MINIO_ACCESS_KEY=%s\n' "${MINIO_ACCESS_KEY}"
            printf 'MINIO_SECRET_KEY=%s\n' "${MINIO_SECRET_KEY}"
            printf 'IMAGE_TAG=%s\n' "${{ steps.tag.outputs.IMAGE_TAG || '' }}"
          } > deploy/.env
          echo "[env] 已生成 deploy/.env"

      # ── 执行部署动作 ──────────────────────────────────────
      - name: 执行部署
        if: ${{ env.ACTION != 'deploy' || success() }}
        run: |
          set -e
          cd /ci
          chmod +x deploy/manage.sh
          TARGETS="${TARGET_SERVICES}"
          if [ -z "${TARGETS}" ] && [ "${SKIP_CI}" != "true" ]; then
            # shellcheck disable=SC1091
            . "${CI_STATE_DIR}/affected.env"
            TARGETS="${BACKEND_AFFECTED} ${FRONTEND_AFFECTED}"
          fi
          # 增量部署且无任何变更 → 跳过，避免 manage.sh 把空目标展开为全量重建
          # 注意：Gitea Actions 用 sh（非 bash）执行 run 块，不能用 ${var//pat/rep} 等 bash 语法
          if [ "${SKIP_CI}" != "true" ] && [ "${ACTION}" = "deploy" ] && [ -z "$(echo "${TARGETS}" | tr -d ' ')" ]; then
            echo "[CI] 无变更，跳过部署"
            exit 0
          fi
          echo "[CI] 目标服务: ${TARGETS:-（全部）}"
          # shellcheck disable=SC2086
          case "${ACTION}" in
            deploy) bash deploy/manage.sh deploy ${TARGETS} ;;
            build)  bash deploy/manage.sh build ${TARGETS} ;;
            start|up)    bash deploy/manage.sh start ${TARGETS} ;;
            stop|down)   bash deploy/manage.sh stop ${TARGETS} ;;
            restart)     bash deploy/manage.sh restart ${TARGETS} ;;
            status)      bash deploy/manage.sh status ;;
            logs)        bash deploy/manage.sh logs ${TARGETS} ;;
            *) echo "[ERROR] 未知 action: ${ACTION}"; exit 1 ;;
          esac

      # ── 部署后健康检查 ────────────────────────────────────
      # 逻辑抽到 deploy/ci/health-check.sh：原内联 python3 -c 多行脚本在 YAML
      # literal block 内顶格写，会终止 block scalar，导致 Gitea 拒绝加载 workflow。
      - name: 健康检查
        if: ${{ env.ACTION == 'deploy' && success() }}
        run: |
          cd /ci
          bash deploy/ci/health-check.sh

      # ── 输出部署后状态 ────────────────────────────────────
      - name: 输出部署后状态
        if: ${{ always() }}
        run: |
          cd /ci
          bash deploy/manage.sh status

      # ── 清理临时密码文件 ──────────────────────────────────
      - name: 清理临时文件
        if: ${{ always() }}
        run: rm -f deploy/.env

      # ── 部署成功后清理构建垃圾 ────────────────────────────
      # 悬空镜像/旧 tag 镜像/构建缓存/退出容器；失败时保留现场便于排查
      - name: 清理构建垃圾
        if: ${{ env.ACTION == 'deploy' && success() }}
        run: bash deploy/manage.sh clean
