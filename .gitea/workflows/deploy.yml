# ============================================================
# 心飞交友 - 部署流水线（Docker 化 + 增量构建 + 健康检查）
#
# 触发方式：
#   1) 自动：push 到 master → 自动增量编译打包 → 只重建受影响容器 → 健康检查
#   2) 手动：Gitea 仓库 Actions 页 → Run workflow，可指定动作与服务范围
#
# 手动输入项（on.workflow_dispatch.inputs，全部下拉选择，位置错误会导致参数失效）：
#   action    : deploy(默认,增量构建并部署) | build(仅构建镜像) | start | stop
#               | restart | status | logs
#   target    : 下拉单选构建/操作目标，选项格式「服务名 · 中文职责」（如
#               xfjy-user-service · 用户服务（资料/关系 :18090）），脚本用
#               ${TARGET_RAW%% *} 只取空格前服务名，中文仅用于页面辨识：
#               auto(默认,按代码变更自动推断，仅对 deploy/build 有效)
#               all(11 个后端 + admin + app) / backend(11 个后端)
#               app(App H5) / admin(后台管理前端)
#               或 11 个微服务逐个单选（含网关/登录/用户/圈子/视频/匹配/消息/
#               主业务/推荐/ES/支付，下拉直接可读不用记名字）
#               多目标批量操作请用 all / backend 聚合项（Gitea 下拉不支持多选）
#   skip_ci   : true = 跳过编译打包；start/stop/restart/status/logs 会自动跳过
#               （无需新产物），此时 target 必须选具体服务或聚合项，auto 会被拒绝
#   full_build: true = 强制全量重建（忽略增量判定）
#
# 并发策略：
#   - 独立并发组 xfjy-deploy，cancel-in-progress=false：
#     实测共享组跨 workflow 会把先入组排队的对方 run 直接 cancel（0 步空跑），
#     与 cancel-in-progress 取值无关，所以 ci/deploy 必须分组
#   - 与 ci.yml 的 m2/npm 缓存卷互斥改用 deploy/ci/build-lock.sh 文件锁：
#     本 job 开头按 m2→npm 固定顺序抢锁（ci 侧只单锁，无死锁），结尾 always 释放；
#     ci 在跑编译时 deploy 会自动排队等锁，效果即"ci 先跑、deploy 随后"
#
# 镜像标签记录（供 ops.yml rollback 使用）：
#   - 部署前把本次 tag 写入 ${CI_STATE_DIR}/pending-deploy-tag
#   - 部署成功后才轮换：current ← pending，previous ← 旧 current
#   - rollback 目标是 previous-deploy-tag（上一个成功上线的版本）
#
# 增量构建原理：
#   1. 对每个 Maven 模块 / 前端目录计算源码指纹（文件内容 SHA256 汇总）
#   2. 与上次构建写入的指纹基线比对 → 得到变更模块
#   3. 沿模块依赖图做反向闭包（改 xfjy-api 会牵连所有依赖它的服务）
#   4. 只对受影响模块跑 mvn package；未受影响的 jar 从产物缓存还原
#   5. 只重建受影响服务的镜像与容器，其余容器原地不动
#
# 部署后健康检查：
#   - 等待容器达到 healthy 状态（超时 60s）
#   - 探测网关 /admin/ 接口是否可访问
#   - 检查失败时输出日志但不阻断（手动排查用）
# ============================================================
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      action:
        description: '动作：deploy=增量构建并部署（默认） / build=仅构建镜像 / start=启动 / stop=停止容器 / restart=重启 / status=状态 / logs=日志'
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - build
          - start
          - stop
          - restart
          - status
          - logs
      target:
        description: '目标：auto=按变更自动推断（默认，仅 deploy/build 有效）/ all=全部前后端 / backend=全部后端 / app=App H5 / admin=后台管理 / 或单个微服务；批量多服务请选 all 或 backend（下拉不支持多选）'
        type: choice
        required: true
        default: 'auto · 自动（按代码变更推断，仅 deploy/build）'
        options:
          - 'auto · 自动（按代码变更推断，仅 deploy/build）'
          - 'all · 全部（11个后端微服务 + 2个前端）'
          - 'backend · 全部后端（11个微服务）'
          - 'app · App H5（手机端页面）'
          - 'admin · 后台管理前端'
          - 'xfjy-gateway · 网关（唯一对外入口 :8090）'
          - 'xfjy-sso · 登录认证（Sa-Token :18080）'
          - 'xfjy-user-service · 用户服务（资料/关系 :18090）'
          - 'xfjy-circle-service · 圈子动态（:18084）'
          - 'xfjy-video-service · 小视频（:18085）'
          - 'xfjy-match-service · 匹配（附近的人/探花 :18082）'
          - 'xfjy-message-service · 消息/IM Token（:18086）'
          - 'xfjy-server · 主业务 BFF（上传/编排 :18081）'
          - 'xfjy-recommend · 推荐消费者（双塔算法，无端口）'
          - 'xfjy-elasticsearch · ES 检索服务（无端口）'
          - 'xfjy-pay-service · 支付/VIP（:18089）'
      skip_ci:
        description: '跳过编译打包（start/stop/restart/status/logs 会自动跳过；auto 目标被拒绝时改选具体服务）'
        type: choice
        required: true
        default: 'false'
        options:
          - 'false'
          - 'true'
      full_build:
        description: '强制全量重建，忽略增量判定'
        type: choice
        required: true
        default: 'false'
        options:
          - 'false'
          - 'true'

concurrency:
  group: xfjy-deploy
  cancel-in-progress: false

env:
  ACTION: ${{ github.event.inputs.action || 'deploy' }}
  TARGET_RAW: ${{ github.event.inputs.target || 'auto' }}
  # start/stop/restart/status/logs 不需要新构建产物，即使下拉选了编译也强制跳过。
  # 必须用 fromJSON 数组 + contains：contains(字符串, '') 对空串恒返回 true，
  # push 事件 inputs.action 为空会被误判成跳过编译（run#117 事故教训）；
  # 数组形式 contains(["start",...], '') 精确匹配元素，空串返回 false。
  SKIP_CI: ${{ (github.event.inputs.skip_ci == 'true' || contains(fromJSON('["start","stop","restart","status","logs"]'), github.event.inputs.action)) && 'true' || 'false' }}
  FULL_BUILD: ${{ github.event.inputs.full_build || 'false' }}
  # 11 个可部署 Spring Boot 应用（xfjy-api 仅为接口库，不打包）
  SERVICES: "xfjy-gateway xfjy-sso xfjy-user-service xfjy-circle-service xfjy-video-service xfjy-match-service xfjy-message-service xfjy-server xfjy-recommend xfjy-elasticsearch xfjy-pay-service"
  CI_STATE_DIR: /opt/ci-state
  MVN_ARGS: "-B -ntp -s deploy/ci/settings.xml -Dmaven.repo.local=/root/.m2/repository"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: xfjy/ci:latest
      volumes:
        - /home/itxinfei/.cache/m2:/root/.m2/repository
        - /home/itxinfei/.cache/npm:/root/.npm
        - /home/itxinfei/.cache/ci-state:/opt/ci-state
    env:
      CI_SHA: ${{ github.sha }}
      CI_REF: ${{ github.ref_name }}
      LOCK_OWNER: "deploy"
      LOCK_TIMEOUT: "3600"
    steps:
      - name: Checkout（按触发 SHA 检出）
        run: |
          set -e
          mkdir -p /ci
          cd /ci
          git init -q .
          git remote add origin http://gitea:3000/admin/xfjy.git
          if ! git fetch -q --depth 1 origin "${CI_SHA}"; then
            echo "[checkout] 按 SHA fetch 失败，回退按分支 fetch: ${CI_REF}"
            git fetch -q --depth 1 origin "refs/heads/${CI_REF}"
          fi
          git checkout -q --detach FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "${CI_SHA}" ]; then
            echo "[WARN] 检出的不是触发 SHA（并发推送），以分支最新为准"
          fi
          git log -1 --oneline

      # ── 抢占缓存卷互斥锁（顺序固定 m2→npm，与 ci 侧单锁不构成环等待） ──
      - name: 获取构建锁 m2
        run: |
          cd /ci
          LOCK_RESOURCE=m2 sh deploy/ci/build-lock.sh acquire

      - name: 获取构建锁 npm
        run: |
          cd /ci
          LOCK_RESOURCE=npm sh deploy/ci/build-lock.sh acquire

      # ── 增量构建范围判定 ──────────────────────────────────
      - name: 判定增量构建范围
        if: ${{ env.SKIP_CI != 'true' }}
        run: |
          set -e
          cd /ci
          chmod +x deploy/ci/*.sh
          bash deploy/ci/incremental-build.sh
          echo "---- 判定结果 ----"
          cat "${CI_STATE_DIR}/affected.env"

      # ── 编译打包（仅受影响模块） ─────────────────────────
      - name: 编译打包
        if: ${{ env.SKIP_CI != 'true' }}
        run: |
          set -e
          cd /ci
          # shellcheck disable=SC1091
          . "${CI_STATE_DIR}/affected.env"
          BUILD_LIST="${BUILD_MODULES}"
          if [ -z "${BUILD_LIST}" ]; then
            echo "[增量] 无模块需要重新编译，全部复用已有产物"
            exit 0
          fi
          # 为参与打包的模块注入 CI 环境配置
          for m in ${BUILD_LIST}; do
            RES="$m/src/main/resources"
            if [ -f "$RES/application.yml" ]; then
              cp -f deploy/application-local.ci.yml "$RES/application-local.yml"
            fi
          done
          PL_LIST="$(echo ${BUILD_LIST} | tr ' ' ',')"
          echo "[增量] 打包模块: ${PL_LIST}"
          # -T 2 而非 -T 1C：宿主机同时跑全套中间件与线上容器，全核并行会把
          # CPU 打满导致面板/线上服务一起卡；限 2 线程用时间换整机流畅
          MAVEN_OPTS="-Xmx1g" mvn ${MVN_ARGS} package -DskipTests -Dmaven.test.skip=true \
              -pl "${PL_LIST}" -am -T 2
          for m in ${BUILD_LIST}; do
            if [ ! -f "$m/target/$m-1.0-SNAPSHOT.jar" ]; then
              echo "ERROR: 未生成 $m/target/$m-1.0-SNAPSHOT.jar"; exit 1
            fi
            echo "OK jar: $m"
          done

      # ── 缓存构建产物与指纹基线 ────────────────────────────
      - name: 缓存构建产物与指纹基线
        if: ${{ env.SKIP_CI != 'true' && success() }}
        run: |
          cd /ci
          bash deploy/ci/cache-artifacts.sh save

      # ── 构建前端（CI 容器内，复用 npm 缓存卷；admin/h5 并行） ──
      # 提速原理：CI job 容器挂载了 /root/.npm 缓存卷，npm ci --prefer-offline
      #          优先走本地缓存秒级装依赖；构建产物 dist 直接暂存进镜像，
      #          Docker build 退化为 COPY dist → nginx，秒级出镜像。
      #          旧方式在 Docker build 内 npm ci，构建容器吃不到缓存卷，每次 3-8 分钟。
      - name: 构建前端
        if: ${{ env.SKIP_CI != 'true' && success() }}
        run: |
          set -e
          cd /ci
          # shellcheck disable=SC1091
          . "${CI_STATE_DIR}/affected.env"
          if [ -z "${FRONTEND_AFFECTED}" ]; then
            echo "[增量] 无前端变更，跳过前端构建"
            exit 0
          fi
          # Node 由 CI 镜像内置（deploy/gitea/Dockerfile.ci ARG NODE_VERSION=22.23.4），
          # 满足 rolldown/sass-embedded 原生二进制包 engines >=22.12，无需 job 内 n 升级。
          echo "[前端] Node 版本: $(node --version)"
          echo "[前端] 受影响工程: ${FRONTEND_AFFECTED}"
          PIDS=""
          # admin / h5 互不依赖，并行构建
          for fe in ${FRONTEND_AFFECTED}; do
            case "${fe}" in
              xfjy-admin)
                echo "[前端] xfjy-admin 构建中..."
                ( cd xfjy-admin \
                  && npm ci --legacy-peer-deps --no-audit --no-fund \
                  && npm rebuild --no-audit --no-fund \
                  && npm run build ) > /tmp/build-admin.log 2>&1 &
                PIDS="$PIDS $!" ;;
              xfjy-h5)
                echo "[前端] xfjy-app(H5) 构建中..."
                ( cd xfjy-app \
                  && npm ci --legacy-peer-deps --no-audit --no-fund \
                  && npm rebuild --no-audit --no-fund \
                  && npm run build:h5 ) > /tmp/build-h5.log 2>&1 &
                PIDS="$PIDS $!" ;;
            esac
          done
          FAIL=0
          for p in ${PIDS}; do
            wait "${p}" || FAIL=1
          done
          echo "---- xfjy-admin 构建日志（尾部）----"
          tail -30 /tmp/build-admin.log 2>/dev/null || true
          echo "---- xfjy-app(H5) 构建日志（尾部）----"
          tail -30 /tmp/build-h5.log 2>/dev/null || true
          if [ "${FAIL}" != "0" ]; then
            echo "[ERROR] 前端构建失败，完整日志见上"
            exit 1
          fi
          # 校验构建产物
          for fe in ${FRONTEND_AFFECTED}; do
            case "${fe}" in
              xfjy-admin) [ -f xfjy-admin/dist/index.html ] || { echo "ERROR: xfjy-admin/dist/index.html 缺失"; exit 1; } ;;
              xfjy-h5)    [ -f xfjy-app/dist/build/h5/index.html ] || { echo "ERROR: xfjy-app/dist/build/h5/index.html 缺失"; exit 1; } ;;
            esac
          done
          echo "[前端] 构建完成"

      # ── 暂存构建上下文 ────────────────────────────────────
      - name: 暂存构建上下文
        if: ${{ env.SKIP_CI != 'true' && success() }}
        run: |
          set -e
          cd /ci
          # shellcheck disable=SC1091
          . "${CI_STATE_DIR}/affected.env"
          bash deploy/ci/stage-artifacts.sh ${BACKEND_AFFECTED}
          if [ -n "${FRONTEND_AFFECTED}" ]; then
            bash deploy/ci/stage-artifacts.sh --frontend-only
          fi
          echo "---- 暂存结果 ----"
          du -sh deploy/build/* 2>/dev/null || true

      # ── 解析镜像标签（写入 pending，部署成功后才轮换为 current） ──
      - name: 解析镜像标签
        if: ${{ env.ACTION == 'deploy' }}
        run: |
          set -e
          cd /ci
          # --depth 1 检出无 tag 对象，git describe 不可用，统一用 commit sha
          TAG="$(git rev-parse --short HEAD)"
          echo "${TAG}" > "${CI_STATE_DIR}/pending-deploy-tag"
          echo "[tag] 本次部署镜像标签: ${TAG}（部署成功后轮换为 current）"

      # ── 准备部署参数（注入中间件密码 + 镜像标签） ──────────
      - name: 准备部署参数
        if: ${{ env.ACTION == 'deploy' }}
        env:
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME || 'root' }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -e
          cd /ci
          if [ -z "${MYSQL_PASSWORD}" ]; then
            echo "[ERROR] 未配置 Secrets.MYSQL_PASSWORD"
            exit 1
          fi
          [ -z "${MINIO_ACCESS_KEY}" ] && echo "[WARN] 未配置 Secrets.MINIO_ACCESS_KEY"
          IMAGE_TAG="$(cat "${CI_STATE_DIR}/pending-deploy-tag")"
          if [ -z "${IMAGE_TAG}" ]; then
            echo "[ERROR] pending-deploy-tag 为空，无法生成 deploy/.env"
            exit 1
          fi
          umask 077
          {
            printf 'MYSQL_USERNAME=%s\n' "${MYSQL_USERNAME}"
            printf 'MYSQL_PASSWORD=%s\n' "${MYSQL_PASSWORD}"
            printf 'NEO4J_PASSWORD=%s\n' "${NEO4J_PASSWORD}"
            printf 'MINIO_ACCESS_KEY=%s\n' "${MINIO_ACCESS_KEY}"
            printf 'MINIO_SECRET_KEY=%s\n' "${MINIO_SECRET_KEY}"
            printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}"
          } > deploy/.env
          echo "[env] 已生成 deploy/.env（IMAGE_TAG=${IMAGE_TAG}）"

      # ── 执行部署动作 ──────────────────────────────────────
      - name: 执行部署
        if: ${{ env.ACTION != 'deploy' || success() }}
        run: |
          set -e
          cd /ci
          chmod +x deploy/manage.sh
          # 下拉项格式「服务名 · 中文说明」，只取第一个空格前的真实服务名（POSIX 参数展开，sh 可用）
          TARGETS="${TARGET_RAW%% *}"
          # auto = 未指定具体目标：deploy/build 交给增量判定；运维动作下会被下面拒绝
          [ "${TARGETS}" = "auto" ] && TARGETS=""
          if [ -z "${TARGETS}" ] && [ "${SKIP_CI}" != "true" ]; then
            # shellcheck disable=SC1091
            . "${CI_STATE_DIR}/affected.env"
            TARGETS="${BACKEND_AFFECTED} ${FRONTEND_AFFECTED}"
          fi
          # skip_ci=true 且未指定服务 → 空 TARGETS 会被 manage.sh 展开为全量，
          # 属于误操作高危路径，直接拒绝（status 不需要目标，放行）
          if [ "${ACTION}" != "status" ] && [ "${SKIP_CI}" = "true" ] && [ -z "$(echo "${TARGETS}" | tr -d ' ')" ]; then
            echo "[ERROR] 当前动作无需编译且 target=auto，请在目标下拉中选择具体服务，或选 backend/all"
            exit 1
          fi
          # 增量部署且无任何变更 → 跳过，避免 manage.sh 把空目标展开为全量重建
          # 注意：Gitea Actions 用 sh（非 bash）执行 run 块，不能用 ${var//pat/rep} 等 bash 语法
          if [ "${SKIP_CI}" != "true" ] && [ "${ACTION}" = "deploy" ] && [ -z "$(echo "${TARGETS}" | tr -d ' ')" ]; then
            echo "[CI] 无变更，跳过部署"
            exit 0
          fi
          echo "[CI] 目标服务: ${TARGETS:-（全部）}"
          # shellcheck disable=SC2086
          case "${ACTION}" in
            deploy) bash deploy/manage.sh deploy ${TARGETS} ;;
            build)  bash deploy/manage.sh build ${TARGETS} ;;
            start|up)    bash deploy/manage.sh start ${TARGETS} ;;
            stop|down)   bash deploy/manage.sh stop ${TARGETS} ;;
            restart)     bash deploy/manage.sh restart ${TARGETS} ;;
            status)      bash deploy/manage.sh status ;;
            logs)        bash deploy/manage.sh logs ${TARGETS} ;;
            *) echo "[ERROR] 未知 action: ${ACTION}"; exit 1 ;;
          esac

      # ── 部署成功后轮换 tag 记录（供 ops rollback 用） ──────
      # 只在部署成功后落笔：失败/取消的 run 不会污染 current/previous
      - name: 轮换部署 tag 记录
        if: ${{ env.ACTION == 'deploy' && success() }}
        run: |
          set -e
          PENDING="${CI_STATE_DIR}/pending-deploy-tag"
          CURRENT="${CI_STATE_DIR}/current-deploy-tag"
          PREVIOUS="${CI_STATE_DIR}/previous-deploy-tag"
          if [ ! -f "${PENDING}" ]; then
            echo "[WARN] 无 pending-deploy-tag（无变更跳过部署？），不轮换记录"
            exit 0
          fi
          if [ -f "${CURRENT}" ]; then
            cp "${CURRENT}" "${PREVIOUS}"
          fi
          cp "${PENDING}" "${CURRENT}"
          rm -f "${PENDING}"
          echo "[tag] current=$(cat "${CURRENT}")"
          echo "[tag] previous=$(cat "${PREVIOUS}" 2>/dev/null || echo '（无，首次部署）')"

      # ── 部署后健康检查 ────────────────────────────────────
      # 逻辑抽到 deploy/ci/health-check.sh：原内联 python3 -c 多行脚本在 YAML
      # literal block 内顶格写，会终止 block scalar，导致 Gitea 拒绝加载 workflow。
      - name: 健康检查
        if: ${{ env.ACTION == 'deploy' && success() }}
        run: |
          cd /ci
          bash deploy/ci/health-check.sh

      # ── 输出部署后状态 ────────────────────────────────────
      - name: 输出部署后状态
        if: ${{ always() }}
        run: |
          cd /ci
          bash deploy/manage.sh status

      # ── 清理临时密码文件 ──────────────────────────────────
      - name: 清理临时文件
        if: ${{ always() }}
        run: |
          cd /ci
          rm -f deploy/.env

      # ── 释放缓存卷互斥锁 ──────────────────────────────────
      - name: 释放构建锁 npm
        if: ${{ always() }}
        run: |
          cd /ci
          LOCK_RESOURCE=npm sh deploy/ci/build-lock.sh release

      - name: 释放构建锁 m2
        if: ${{ always() }}
        run: |
          cd /ci
          LOCK_RESOURCE=m2 sh deploy/ci/build-lock.sh release

      # ── 部署成功后清理构建垃圾 ────────────────────────────
      # 悬空镜像/旧 tag 镜像/构建缓存/退出容器；失败时保留现场便于排查
      - name: 清理构建垃圾
        if: ${{ env.ACTION == 'deploy' && success() }}
        run: |
          cd /ci
          bash deploy/manage.sh clean
