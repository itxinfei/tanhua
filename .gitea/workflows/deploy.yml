# ============================================================
# 心飞交友 - Gitea Actions 部署流水线（Docker 化）
#
# 触发方式：
#   1) 自动：push 到 master → 自动编译打包并部署全部容器
#   2) 手动：Gitea 仓库 Actions 页 → Run workflow，可指定动作与服务范围
#
# 手动输入项：
#   action   : deploy(默认) | build | start | stop | restart | status | logs
#   services : 空格分隔的服务名；留空 = 全部服务
#              后端微服务：xfjy-gateway xfjy-sso xfjy-user-service xfjy-circle-service
#                        xfjy-video-service xfjy-match-service xfjy-message-service
#                        xfjy-server xfjy-recommend xfjy-elasticsearch xfjy-pay-service
#              前端：admin(xfjy-admin) / app(xfjy-h5)
#   skip_ci  : true = 跳过编译打包（仅对已有产物做启停等操作）
#
# 阶段：
#   1) 后端 Maven 编译
#   2) 后端服务打包（为 11 个 Spring Boot 应用注入 application-local.yml 并校验 jar）
#   3) 通过 deploy/manage.sh 统一执行部署/启停（前端失败不阻断后端）
#
# 部署模型：
#   - job 容器内挂载宿主 /var/run/docker.sock（act_runner 默认已挂载），
#     直接驱动宿主机 docker 构建镜像并运行容器，单主机免 registry。
#   - Java 服务用 network_mode: host，复用既有 127.0.0.1 中间件连接串；
#     前端用 nginx 容器 + 端口映射（admin:5174 / h5:5173）。
#   - 约定：CI 只构建与部署，不向 Gitee 写回任何东西。
# ============================================================
name: deploy

# ── 触发器 ──────────────────────────────────────────────────
# 注意（Gitea 1.22 兼容性）：Gitea 内置的 act v0.259.1 在解析 on: 时，
# 会把每个事件的值当作"分支过滤条件"处理。若在 workflow_dispatch 下写 inputs，
# 会触发 "unknown on type" 并导致整个 workflow 被忽略（push 也不再触发）。
# 因此 dispatch 参数统一放在顶层 inputs:，on.workflow_dispatch 留空。
on:
  push:
    branches: [master]
  workflow_dispatch:

# 手动触发的输入项（Gitea 1.22 顶层 inputs 语法）
inputs:
  action:
    description: '动作：deploy(默认,重新构建并部署) | build(仅构建) | start | stop | restart | status | logs'
    required: true
    default: 'deploy'
  services:
    description: '服务名，空格分隔；留空表示全部服务'
    required: false
    default: ''
  skip_ci:
    description: 'true = 跳过编译打包，仅对已有容器做启停操作'
    required: false
    default: 'false'

env:
  ACTION: ${{ github.event.inputs.action || 'deploy' }}
  TARGET_SERVICES: ${{ github.event.inputs.services || '' }}
  SKIP_CI: ${{ github.event.inputs.skip_ci || 'false' }}
  # 11 个可部署 Spring Boot 应用（xfjy-api 仅为接口库，不打包）
  SERVICES: "xfjy-gateway xfjy-sso xfjy-user-service xfjy-circle-service xfjy-video-service xfjy-match-service xfjy-message-service xfjy-server xfjy-recommend xfjy-elasticsearch xfjy-pay-service"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 说明：act_runner 已默认把宿主 /var/run/docker.sock 挂进 job 容器，
    # 这里不能再声明 volumes，否则会出现 "Duplicate mount point" 导致容器创建失败。
    container:
      image: xfjy/ci:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 后端 Maven 编译
        if: ${{ env.SKIP_CI != 'true' }}
        run: mvn -B -ntp compile -DskipTests

      - name: 后端服务打包（注入 application-local.yml）
        if: ${{ env.SKIP_CI != 'true' }}
        run: |
          set -e
          for svc in $SERVICES; do
            RES="$svc/src/main/resources"
            if [ -f "$RES/application.yml" ]; then
              [ -f "$RES/application-local.yml" ] || cp -f deploy/application-local.ci.yml "$RES/application-local.yml"
            fi
          done
          # SERVICES 是空格分隔的模块列表，-pl 需要逗号分隔
          PL_LIST="$(echo $SERVICES | tr ' ' ',')"
          echo "打包模块: ${PL_LIST}"
          mvn -B -ntp package -DskipTests -pl "${PL_LIST}" -am
          for svc in $SERVICES; do
            if [ ! -f "$svc/target/$svc-1.0-SNAPSHOT.jar" ]; then
              echo "ERROR: 未生成 $svc/target/$svc-1.0-SNAPSHOT.jar"; exit 1
            fi
            echo "OK jar: $svc"
          done

      - name: 准备部署参数（注入中间件密码）
        if: ${{ env.SKIP_CI != 'true' && env.ACTION == 'deploy' }}
        env:
          # 中间件真实密码：来自 Gitea Actions Secrets（仓库设置 → Actions → Secrets）
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME || 'root' }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          set -e
          if [ -z "${MYSQL_PASSWORD}" ]; then
            echo "[ERROR] 未配置 Secrets.MYSQL_PASSWORD，服务将无法连接数据库"
            echo "       请在 Gitea 仓库 → Settings → Actions → Secrets 添加 MYSQL_PASSWORD"
            exit 1
          fi
          # deploy/.env 被 .gitignore 排除，仓库里没有；密码从 Secrets 注入到临时 env 文件
          umask 077
          printf 'MYSQL_USERNAME=%s\nMYSQL_PASSWORD=%s\nNEO4J_PASSWORD=%s\n' \
            "${MYSQL_USERNAME}" "${MYSQL_PASSWORD}" "${NEO4J_PASSWORD}" > deploy/.env

      - name: 执行部署动作
        if: ${{ env.SKIP_CI != 'true' || env.ACTION != 'deploy' }}
        run: |
          set -e
          chmod +x deploy/manage.sh
          # shellcheck disable=SC2086
          case "${ACTION}" in
            deploy)
              bash deploy/manage.sh deploy ${TARGET_SERVICES}
              ;;
            build)
              bash deploy/manage.sh build ${TARGET_SERVICES}
              ;;
            start|up)
              bash deploy/manage.sh start ${TARGET_SERVICES}
              ;;
            stop|down)
              bash deploy/manage.sh stop ${TARGET_SERVICES}
              ;;
            restart)
              bash deploy/manage.sh restart ${TARGET_SERVICES}
              ;;
            status)
              bash deploy/manage.sh status
              ;;
            logs)
              bash deploy/manage.sh logs ${TARGET_SERVICES}
              ;;
            *)
              echo "[ERROR] 未知 action: ${ACTION}"; exit 1
              ;;
          esac

      - name: 输出部署后状态
        if: ${{ always() }}
        run: bash deploy/manage.sh status

      - name: 清理临时密码文件
        if: ${{ always() }}
        run: rm -f deploy/.env
