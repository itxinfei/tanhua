# ============================================================
# 心飞交友 - CI 质量门禁
#
# 职责：push / MR 触发，只做代码质量检查，不部署。
#   1. 后端：mvn test-compile 编译验证（所有模块，确保不破坏编译）
#   2. 前端 admin：vue-tsc 类型检查 + 生产构建（构建期错误不再漏到 deploy）
#   3. 前端 app：vue-tsc 类型检查 + build:h5 生产构建 + stylelint（非阻断）
#
# 与 deploy.yml 的关系：
#   - 各自独立并发组（本实例实测：共享组时后入组的 run 会把同组排队的
#     另一 workflow run 直接 cancel，0 步空跑，与 cancel-in-progress 取值无关）
#   - ci 组 cancel-in-progress=false：门禁必须完整跑完
#   - 跨 workflow 的 m2/npm 缓存卷互斥改用 deploy/ci/build-lock.sh 文件锁：
#     每个触碰共享缓存的 job 在首步 acquire、末步 release（always 兜底）
#   - Checkout 按触发 SHA 锁定：验证的一定是触发这次 run 的代码
# ============================================================
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-gate
  cancel-in-progress: false

env:
  MVN_ARGS: "-B -ntp -s deploy/ci/settings.xml -Dmaven.repo.local=/root/.m2/repository"

jobs:
  # ── 后端编译验证 ──────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: xfjy/ci:latest
      volumes:
        - /home/itxinfei/.cache/m2:/root/.m2/repository
        - /home/itxinfei/.cache/ci-state:/opt/ci-state
    env:
      CI_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CI_STATE_DIR: /opt/ci-state
      LOCK_OWNER: "ci-backend"
      LOCK_RESOURCE: m2
      LOCK_TIMEOUT: "3600"
    steps:
      - name: Checkout（按触发 SHA 检出）
        run: |
          set -e
          mkdir -p /ci
          cd /ci
          git init -q .
          git remote add origin http://gitea:3000/admin/xfjy.git
          if ! git fetch -q --depth 1 origin "${CI_SHA}"; then
            echo "[checkout] 按 SHA fetch 失败，回退按分支 fetch: ${CI_REF}"
            git fetch -q --depth 1 origin "refs/heads/${CI_REF}"
          fi
          git checkout -q --detach FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "${CI_SHA}" ]; then
            echo "[WARN] 检出的不是触发 SHA（并发推送或 PR 已更新），以分支最新为准"
          fi
          git log -1 --oneline

      - name: 获取构建锁（与 deploy 互斥共享 m2 卷）
        run: |
          cd /ci
          sh deploy/ci/build-lock.sh acquire

      - name: 编译所有模块（test-compile，跳过测试执行）
        run: |
          cd /ci
          MAVEN_OPTS="-Xmx1g" mvn ${MVN_ARGS} test-compile -DskipTests -T 2 -U
          echo "[OK] 全部 Maven 模块编译通过"

      - name: 释放构建锁
        if: ${{ always() }}
        run: |
          cd /ci
          sh deploy/ci/build-lock.sh release

  # ── 前端 admin 类型检查 + 构建 ────────────────────────────
  frontend-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: xfjy/ci:latest
      volumes:
        - /home/itxinfei/.cache/npm:/root/.npm
        - /home/itxinfei/.cache/ci-state:/opt/ci-state
    env:
      CI_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CI_STATE_DIR: /opt/ci-state
      LOCK_OWNER: "ci-admin"
      LOCK_RESOURCE: npm
      LOCK_TIMEOUT: "3600"
    steps:
      - name: Checkout（按触发 SHA 检出）
        run: |
          set -e
          mkdir -p /ci
          cd /ci
          git init -q .
          git remote add origin http://gitea:3000/admin/xfjy.git
          if ! git fetch -q --depth 1 origin "${CI_SHA}"; then
            echo "[checkout] 按 SHA fetch 失败，回退按分支 fetch: ${CI_REF}"
            git fetch -q --depth 1 origin "refs/heads/${CI_REF}"
          fi
          git checkout -q --detach FETCH_HEAD
          git log -1 --oneline

      - name: 获取构建锁（与 deploy 互斥共享 npm 卷）
        run: |
          cd /ci
          sh deploy/ci/build-lock.sh acquire

      # Node 由 CI 镜像内置（deploy/gitea/Dockerfile.ci ARG NODE_VERSION=22.23.4），
      # 满足 rolldown 原生包 engines >=22.12，无需在 job 内临时 n 升级
      - name: 安装依赖并类型检查
        run: |
          cd /ci/xfjy-admin
          # 必须 npm ci 严格按 lock 落地整棵树：npm install 重算时会偶发漏装
          # peerDependencies（pinia4 的 @vue/devtools-api 非根直接依赖），致 vite 构建
          # 报 Rolldown failed to resolve import。与 deploy.yml 前端构建命令保持一致。
          npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
          npx vue-tsc --noEmit
          echo "[OK] xfjy-admin 类型检查通过"

      - name: 生产构建
        run: |
          cd /ci/xfjy-admin
          npm run build
          [ -f dist/index.html ] || { echo "ERROR: dist/index.html 缺失"; exit 1; }
          echo "[OK] xfjy-admin 构建通过"

      - name: 释放构建锁
        if: ${{ always() }}
        run: |
          cd /ci
          sh deploy/ci/build-lock.sh release

  # ── 前端 admin 样式基线门禁 ───────────────────────────────
  # 只校验 stylelint 的 warning 数量，不阻断存量违规：
  #   基线登记在 xfjy-admin/stylelint-baseline.json，总数与单文件数量都不得上涨。
  #   与 frontend-app 的 lint:style（非阻断）互不影响，两者各自独立 job。
  frontend-admin-style:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: xfjy/ci:latest
      volumes:
        - /home/itxinfei/.cache/npm:/root/.npm
        - /home/itxinfei/.cache/ci-state:/opt/ci-state
    env:
      CI_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CI_STATE_DIR: /opt/ci-state
      LOCK_OWNER: "ci-admin-style"
      LOCK_RESOURCE: npm
      LOCK_TIMEOUT: "3600"
    steps:
      - name: Checkout（按触发 SHA 检出）
        run: |
          set -e
          mkdir -p /ci
          cd /ci
          git init -q .
          git remote add origin http://gitea:3000/admin/xfjy.git
          if ! git fetch -q --depth 1 origin "${CI_SHA}"; then
            echo "[checkout] 按 SHA fetch 失败，回退按分支 fetch: ${CI_REF}"
            git fetch -q --depth 1 origin "refs/heads/${CI_REF}"
          fi
          git checkout -q --detach FETCH_HEAD
          git log -1 --oneline

      - name: 获取构建锁（与 deploy 互斥共享 npm 卷）
        run: |
          cd /ci
          sh deploy/ci/build-lock.sh acquire

      # Node 由 CI 镜像内置 22.23.4，无需 n 临时升级
      - name: 安装依赖
        run: |
          cd /ci/xfjy-admin
          npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: 样式 warning 基线门禁（不得超过基线）
        run: |
          cd /ci/xfjy-admin
          npm run lint:style:gate

      - name: 释放构建锁
        if: ${{ always() }}
        run: |
          cd /ci
          sh deploy/ci/build-lock.sh release

  # ── 前端 app 类型检查 + 构建 ──────────────────────────────
  frontend-app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: xfjy/ci:latest
      volumes:
        - /home/itxinfei/.cache/npm:/root/.npm
        - /home/itxinfei/.cache/ci-state:/opt/ci-state
    env:
      CI_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CI_STATE_DIR: /opt/ci-state
      LOCK_OWNER: "ci-app"
      LOCK_RESOURCE: npm
      LOCK_TIMEOUT: "3600"
    steps:
      - name: Checkout（按触发 SHA 检出）
        run: |
          set -e
          mkdir -p /ci
          cd /ci
          git init -q .
          git remote add origin http://gitea:3000/admin/xfjy.git
          if ! git fetch -q --depth 1 origin "${CI_SHA}"; then
            echo "[checkout] 按 SHA fetch 失败，回退按分支 fetch: ${CI_REF}"
            git fetch -q --depth 1 origin "refs/heads/${CI_REF}"
          fi
          git checkout -q --detach FETCH_HEAD
          git log -1 --oneline

      - name: 获取构建锁（与 deploy 互斥共享 npm 卷）
        run: |
          cd /ci
          sh deploy/ci/build-lock.sh acquire

      - name: 安装依赖并类型检查
        run: |
          cd /ci/xfjy-app
          # 必须 npm ci 严格按 lock 落地整棵树：npm install 重算时会偶发漏装
          # peerDependencies（pinia4 的 @vue/devtools-api 非根直接依赖），致 vite 构建
          # 报 Rolldown failed to resolve import。与 deploy.yml 前端构建命令保持一致。
          npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
          npm run type-check
          echo "[OK] xfjy-app 类型检查通过"

      - name: 生产构建（H5）
        run: |
          cd /ci/xfjy-app
          npm run build:h5
          [ -f dist/build/h5/index.html ] || { echo "ERROR: dist/build/h5/index.html 缺失"; exit 1; }
          echo "[OK] xfjy-app H5 构建通过"

      - name: 样式检查（非阻断，存量违规清理前不挡门禁）
        continue-on-error: true
        run: |
          cd /ci/xfjy-app
          if node -e "process.exit(require('./package.json').scripts['lint:style']?0:1)"; then
            npm run lint:style
          else
            echo "[skip] package.json 尚无 lint:style 脚本"
          fi

      - name: 释放构建锁
        if: ${{ always() }}
        run: |
          cd /ci
          sh deploy/ci/build-lock.sh release
