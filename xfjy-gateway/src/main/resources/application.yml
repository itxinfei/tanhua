server:
  port: 8080

spring:
  application:
    name: xfjy-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      # 静态路由（本地开发版）。接入 Nacos 后改为 lb://xfjy-xxx 服务名路由
      routes:
        - id: xfjy-sso
          uri: http://localhost:18080
          predicates:
            - Path=/user/**
        - id: xfjy-server
          uri: http://localhost:18081
          predicates:
            - Path=/users/**,/movements/**,/comments/**,/messages/**,/smallVideos/**,/huanxin/**,/baidu/**,/xfjy/**,/admin/**
        # TODO 阶段二/三：新增 user-service 18081(拆出后改端口)、match 18082、circle 18084、video 18085、message 18086 路由
