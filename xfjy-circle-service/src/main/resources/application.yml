server:
  port: 18084

spring:
  application:
    name: xfjy-circle-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
  mongodb:
    uri: mongodb://127.0.0.1:27017/xfjy
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

# RocketMQ：圈子评分事件生产（xfjy-quanzi topic，消费方为 xfjy-recommend）
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: xfjy-circle
    send-message-timeout: 3000