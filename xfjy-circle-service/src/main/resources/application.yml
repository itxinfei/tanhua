server:
  port: 18084

spring:
  application:
    name: xfjy-circle-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
        namespace: ${NACOS_NAMESPACE:}
  mongodb:
    uri: mongodb://192.168.20.130:27017/xfjy
  data:
    redis:
      host: 192.168.20.130
      port: 6379
      password: 123456
      database: 0

# RocketMQ：圈子评分事件生产（xfjy-quanzi topic，消费方为 xfjy-recommend）
rocketmq:
  name-server: 192.168.20.130:9876
  producer:
    group: xfjy-circle
    send-message-timeout: 3000