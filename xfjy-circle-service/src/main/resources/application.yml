server:
  port: 18084

spring:
  application:
    name: xfjy-circle-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.20.133:8848
        username: nacos
        password: nacos
        namespace:
        # 默认不注册，仅订阅（discovery 仍可用）：本地裸跑通常只起部分服务，
        # 注册后会被网关/其他服务轮询到并因下游不可达返回 503。
        # CI/容器打包由 deploy/application-local.ci.yml 覆盖为 true；本地需参与服务发现时
        # 在 application-local.yml 里显式设回 true。
        register-enabled: false
  profiles:
    active: local
  mongodb:
    uri: mongodb://192.168.20.133:27017/xfjy
    auto-index-creation: true
  data:
    redis:
      host: 192.168.20.133
      port: 6379
      password: 
      database: 0

# 内部服务鉴权 Token（可选逗号分隔，生产环境建议通过 INTERNAL_AUTH_TOKENS 环境变量注入覆盖）
internal:
  auth:
    tokens: xfjy-internal-dev-token-change-in-prod

# RocketMQ：圈子评分事件生产（xfjy-quanzi topic，消费方为 xfjy-recommend）
rocketmq:
  name-server: 192.168.20.133:9876
  producer:
    group: xfjy-circle
    send-message-timeout: 3000