server:
  port: 18080

spring:
  application:
    name: xfjy-sso
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://192.168.20.130:3306/xfjy?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:xfjy}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:192.168.20.130}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}

# MyBatis Plus
mybatis-plus:
  global-config:
    banner: false
    db-config:
      table-prefix: tb_
      id-type: auto

# Sa-Token（用户端会话，Redis 存储，全部服务共享校验）
sa-token:
  token-name: Authorization
  timeout: 604800        # 7 天
  is-concurrent: true
  is-share: true         # 同一账号多端共享一个 token
  token-style: uuid
  is-log: false
