server:
  port: 18080

spring:
  application:
    name: xfjy-sso
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.20.133:8848
        username: nacos
        password: nacos
        namespace:
        # 默认不注册，仅订阅（discovery 仍可用）：本地裸跑通常只起部分服务，
        # 注册后会被网关/其他服务轮询到并因下游不可达返回 503。
        # CI/容器打包由 deploy/application-local.ci.yml 覆盖为 true；本地需参与服务发现时
        # 在 application-local.yml 里显式设回 true。
        register-enabled: false
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.20.133:3306/xfjy?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: 192.168.20.133
      port: 6379
      password: 

# MyBatis Plus
mybatis-plus:
  global-config:
    banner: false
    db-config:
      table-prefix: tb_
      id-type: auto

# Sa-Token（用户端会话，Redis 存储，全部服务共享校验）
sa-token:
  token-name: Authorization
  timeout: 604800        # 7 天（与 xfjy-server 一致，见 AGENTS.md）
  active-timeout: -1     # 不自动续签
  is-concurrent: true
  is-share: true         # 同一账号多端共享一个 token
  token-style: uuid
  is-log: false

# 内部服务鉴权 Token（可选逗号分隔，生产环境建议通过 INTERNAL_AUTH_TOKENS 环境变量注入覆盖）
internal:
  auth:
    tokens: xfjy-internal-dev-token-change-in-prod
