server:
  port: 18089

spring:
  application:
    name: xfjy-pay-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.20.133:8848
        username: nacos
        password: nacos
        namespace:
  data:
    redis:
      host: 192.168.20.133
      port: 6379
      password: 123456
      timeout: 10s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.20.133:3306/xfjy?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# 内部服务鉴权 Token（可选逗号分隔，生产环境建议通过 INTERNAL_AUTH_TOKENS 环境变量注入覆盖）
internal:
  auth:
    tokens: -xfjy-internal-dev-token-change-in-prod

# MyBatis-Plus（tb_vip_package / tb_pay_order / tb_user_vip 由本服务独占）
mybatis-plus:
  global-config:
    db-config:
      table-prefix: tb_
      id-type: auto