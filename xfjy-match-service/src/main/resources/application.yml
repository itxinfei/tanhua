server:
  port: 18082

spring:
  application:
    name: xfjy-match-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
  profiles:
    active: local
  mongodb:
    uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/xfjy}

# ES服务地址（xfjy-elasticsearch 模块的HTTP接口，附近的人查询）
es:
  server:
    url: ${ES_SERVER_URL:http://127.0.0.1:18088/es/}