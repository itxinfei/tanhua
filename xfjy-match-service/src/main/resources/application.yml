server:
  port: 18082

spring:
  application:
    name: xfjy-match-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
        namespace: ${NACOS_NAMESPACE:}
  profiles:
    active: local
  mongodb:
    uri: mongodb://192.168.20.130:27017/xfjy

# ES服务地址（xfjy-elasticsearch 模块的HTTP接口，附近的人查询）
es:
  server:
    url: http://127.0.0.1:18088/es/