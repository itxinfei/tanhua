# MongoDB连接配置（mongo-spark-connector 10.x 格式）
# 敏感连接信息通过环境变量注入，冒号后为本地回退默认值
spark.mongodb.connection.uri=${MONGO_URI:mongodb://127.0.0.1:27017/?readPreference=primaryPreferred}
spark.mongodb.database=${MONGO_DB:xfjy}
spark.mongodb.collection.quanzi=recommend_quanzi_20191001
spark.mongodb.collection.video=recommend_video_20191010
spark.mongodb.collection.user=recommend_user
redis.cluster.nodes=${REDIS_CLUSTER_NODES:127.0.0.1:6379}
jdbc.driver-class-name=com.mysql.cj.jdbc.Driver
jdbc.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/xfjy?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai}
jdbc.username=${MYSQL_USERNAME:root}
jdbc.password=${MYSQL_PASSWORD:root}