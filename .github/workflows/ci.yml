name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: 后端 Maven 编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Maven 编译（跳过测试）
        run: mvn -B -ntp compile -DskipTests

  admin:
    name: 管理后台构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xfjy-admin
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xfjy-admin/package-lock.json
      - run: npm ci
      - run: npm run build

  app:
    name: App H5 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xfjy-app
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xfjy-app/package-lock.json
      - run: npm ci
      - run: npm run build:h5